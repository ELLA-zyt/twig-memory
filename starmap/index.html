<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆星空 · Twig Starmap</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #05051a;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: #fff;
  cursor: default;
}
#starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

/* 星空背景层 */
.bg-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 15% 25%, rgba(138, 99, 210, 0.4) 0%, transparent 45%),
    radial-gradient(ellipse at 85% 75%, rgba(79, 156, 210, 0.35) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 50%, rgba(255, 150, 200, 0.15) 0%, transparent 55%),
    radial-gradient(ellipse at 30% 80%, rgba(100, 200, 255, 0.2) 0%, transparent 40%),
    radial-gradient(ellipse at 70% 20%, rgba(200, 150, 255, 0.25) 0%, transparent 40%),
    linear-gradient(180deg, #02020f 0%, #080828 30%, #0f0830 50%, #080820 70%, #02020f 100%);
}

/* 星云光斑 */
.nebula {
  position: fixed; border-radius: 50%;
  filter: blur(100px); opacity: 0.5;
  z-index: 0; pointer-events: none;
}
.nebula-1 {
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(138, 99, 210, 0.5) 0%, transparent 65%);
  top: -150px; left: -100px;
  animation: drift1 40s ease-in-out infinite;
}
.nebula-2 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(79, 156, 210, 0.4) 0%, transparent 65%);
  bottom: -100px; right: -80px;
  animation: drift2 35s ease-in-out infinite;
}
.nebula-3 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(255, 180, 220, 0.3) 0%, transparent 65%);
  top: 50%; left: 40%;
  animation: drift3 45s ease-in-out infinite;
}
@keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(100px, 80px) scale(1.15);} }
@keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(-80px, -60px) scale(0.9);} }
@keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(-60px, 70px) scale(1.1);} }

/* 标题 */
.header {
  position: fixed; top: 40px; left: 50%;
  transform: translateX(-50%); z-index: 10;
  text-align: center; pointer-events: none;
}
.header h1 {
  font-size: 36px; font-weight: 200;
  letter-spacing: 12px;
  background: linear-gradient(135deg, #e0d4ff 0%, #a8d8ff 40%, #ffc8e0 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 60px rgba(180, 160, 255, 0.4);
}
.header p {
  margin-top: 10px; font-size: 12px;
  letter-spacing: 6px;
  color: rgba(255,255,255,0.3);
}

/* 统计面板 */
.stats {
  position: fixed; top: 40px; right: 40px; z-index: 10;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 20px 24px; min-width: 160px;
}
.stats-item { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.stats-item:last-child { margin-bottom: 0; }
.stats-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.stats-dot.fragment { background: #8ecae6; box-shadow: 0 0 10px #8ecae6, 0 0 20px rgba(142,202,230,0.5); }
.stats-dot.thread { background: #c9b8ff; box-shadow: 0 0 10px #c9b8ff, 0 0 20px rgba(201,184,255,0.5); }
.stats-dot.claim { background: #ffd6a5; box-shadow: 0 0 12px #ffd6a5, 0 0 25px rgba(255,214,165,0.6); }
.stats-label { font-size: 13px; color: rgba(255,255,255,0.5); flex: 1; }
.stats-value { font-size: 20px; font-weight: 300; color: #fff; }

/* 底部操作区 */
.footer {
  position: fixed; bottom: 40px; left: 50%;
  transform: translateX(-50%); z-index: 10;
  display: flex; gap: 14px; align-items: center;
  background: rgba(20, 18, 50, 0.4);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 30px;
  padding: 10px 12px 10px 20px;
}
.footer input {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 10px 16px; color: #fff;
  font-size: 13px; width: 130px;
  outline: none; backdrop-filter: blur(10px);
  transition: all 0.3s;
}
.footer input:focus {
  border-color: rgba(180,160,255,0.6);
  box-shadow: 0 0 20px rgba(180,160,255,0.2);
}
.footer input::placeholder { color: rgba(255,255,255,0.3); }
.footer button {
  background: linear-gradient(135deg, rgba(138,99,210,0.8), rgba(79,156,210,0.8));
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 10px 22px; color: #fff;
  font-size: 13px; cursor: pointer;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
  letter-spacing: 1px;
}
.footer button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(138,99,210,0.5);
}

/* 星星详情弹窗 */
.star-detail {
  position: fixed; z-index: 100;
  width: 360px; max-width: 90vw;
  background: rgba(20, 18, 45, 0.9);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 0;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  transform: scale(0.95) translateY(10px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(138,99,210,0.15);
  overflow: hidden;
}
.star-detail.visible {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1) translateY(0);
}
.star-detail-header {
  padding: 18px 22px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; gap: 12px;
}
.star-detail-icon {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.star-detail-icon.fragment {
  background: radial-gradient(circle, rgba(142,202,230,0.3), transparent 70%);
  box-shadow: 0 0 15px rgba(142,202,230,0.4);
}
.star-detail-icon.thread {
  background: radial-gradient(circle, rgba(201,184,255,0.3), transparent 70%);
  box-shadow: 0 0 15px rgba(201,184,255,0.4);
}
.star-detail-icon.claim {
  background: radial-gradient(circle, rgba(255,214,165,0.3), transparent 70%);
  box-shadow: 0 0 15px rgba(255,214,165,0.4);
}
.star-detail-title { font-size: 15px; font-weight: 500; }
.star-detail-type { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
.star-detail-body {
  padding: 18px 22px 20px;
  font-size: 14px; line-height: 1.7;
  color: rgba(255,255,255,0.85);
  max-height: 300px;
  overflow-y: auto;
  word-break: break-word;
}
.star-detail-body::-webkit-scrollbar { width: 4px; }
.star-detail-body::-webkit-scrollbar-track { background: transparent; }
.star-detail-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
.star-detail-footer {
  padding: 10px 22px 16px;
  font-size: 11px; color: rgba(255,255,255,0.35);
  display: flex; justify-content: space-between;
}
.star-detail-close {
  position: absolute; top: 12px; right: 14px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  border: none; color: rgba(255,255,255,0.5);
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.star-detail-close:hover { background: rgba(255,255,255,0.12); color: #fff; }

/* 加载 */
.loading {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50; text-align: center;
  transition: opacity 0.5s;
}
.loading.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 50px; height: 50px;
  border: 2px solid rgba(255,255,255,0.08);
  border-top-color: #c9b8ff;
  border-radius: 50%;
  animation: spin 1.2s linear infinite;
  margin: 0 auto 18px;
  box-shadow: 0 0 20px rgba(201,184,255,0.2);
}
.loading p { font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 流星 */
.shooting-star {
  position: fixed;
  width: 3px; height: 3px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 10px 3px rgba(255,255,255,0.8), 0 0 20px rgba(200,180,255,0.5);
  z-index: 2; pointer-events: none;
}
.shooting-star::after {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 120px; height: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,0.9), rgba(200,180,255,0.3), transparent);
  transform-origin: left center;
}

/* 提示文字 */
.hint {
  position: fixed;
  bottom: 110px; left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-size: 12px;
  color: rgba(255,255,255,0.25);
  letter-spacing: 2px;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div class="nebula nebula-3"></div>

<canvas id="starfield"></canvas>

<div class="header">
  <h1>记忆星空</h1>
  <p>TWIG · STARMAP</p>
</div>

<div class="stats">
  <div class="stats-item">
    <div class="stats-dot fragment"></div>
    <span class="stats-label">记忆碎片</span>
    <span class="stats-value" id="count-fragments">0</span>
  </div>
  <div class="stats-item">
    <div class="stats-dot thread"></div>
    <span class="stats-label">线索星座</span>
    <span class="stats-value" id="count-threads">0</span>
  </div>
  <div class="stats-item">
    <div class="stats-dot claim"></div>
    <span class="stats-label">认知亮星</span>
    <span class="stats-value" id="count-claims">0</span>
  </div>
</div>

<div class="hint">点击星星查看记忆 · 滚动缩放 · 拖拽旋转</div>

<div class="footer">
  <input type="text" id="userIdInput" placeholder="userId" value="muqiu">
  <input type="password" id="tokenInput" placeholder="auth token">
  <button onclick="loadStarmap()">点亮星空</button>
</div>

<div class="star-detail" id="starDetail">
  <button class="star-detail-close" onclick="closeDetail()">×</button>
  <div class="star-detail-header">
    <div class="star-detail-icon" id="detailIcon">✦</div>
    <div>
      <div class="star-detail-title" id="detailTitle">记忆碎片</div>
      <div class="star-detail-type" id="detailType">fragment</div>
    </div>
  </div>
  <div class="star-detail-body" id="detailBody"></div>
  <div class="star-detail-footer">
    <span id="detailTime"></span>
    <span id="detailId"></span>
  </div>
</div>

<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <p>正在唤醒记忆星空</p>
</div>

<script>
const CONFIG = {
  apiBase: 'https://yubai-memory.zeabur.app',
  starBaseSize: 4,
  claimSize: 10,
  threadLineOpacity: 0.25,
  twinkleSpeed: 0.015,
  rotationSpeed: 0.0001,
  shootingStarInterval: 3500,
};

const state = {
  stars: [], threads: [], claims: [], fragments: [],
  centerX: 0, centerY: 0,
  rotation: 0,
  scale: 1,
  targetScale: 1,
  offsetX: 0, offsetY: 0,
  targetOffsetX: 0, targetOffsetY: 0,
  isDragging: false,
  dragStartX: 0, dragStartY: 0,
  dragStartRot: 0, dragStartOffsetY: 0,
  selectedStar: null,
};

const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  state.centerX = canvas.width / 2;
  state.centerY = canvas.height / 2;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function getAuthToken() {
  const inputEl = document.getElementById("tokenInput");
  if (inputEl && inputEl.value.trim()) return inputEl.value.trim();
  const params = new URLSearchParams(window.location.search);
  return params.get("token") || '';
}

function getApiBase() {
  return CONFIG.apiBase || window.location.origin;
}

async function fetchState(userId) {
  const token = getAuthToken();
  const headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(getApiBase() + '/v1/state?userId=' + encodeURIComponent(userId), { headers });
  if (!res.ok) throw new Error('请求失败: ' + res.status);
  return await res.json();
}

function buildStarmap(data) {
  state.stars = []; state.threads = []; state.claims = []; state.fragments = [];

  const fragments = data.fragments || [];
  const threads = data.threads || [];
  const claims = data.claims || [];

  const maxRadius = Math.min(canvas.width, canvas.height) * 0.38;
  const minRadius = maxRadius * 0.15;

  fragments.forEach((frag, i) => {
    const angle = (i / fragments.length) * Math.PI * 2 + Math.random() * 0.4;
    const radius = minRadius + Math.random() * (maxRadius - minRadius);
    // 根据记忆的情绪强度调整大小和亮度
    const vad = frag.vad || {};
    const arousal = vad.arousal !== undefined ? vad.arousal : 0.5;
    const dominance = vad.dominance !== undefined ? vad.dominance : 0.5;
    const intensity = (arousal + dominance) / 2;
    const sizeMultiplier = 0.6 + intensity * 1.2;
    const brightnessBase = 0.4 + intensity * 0.5;

    const star = {
      id: frag.id || 'frag_' + i,
      type: 'fragment',
      x: Math.cos(angle) * radius,
      y: Math.sin(angle) * radius,
      baseSize: CONFIG.starBaseSize * sizeMultiplier * (0.8 + Math.random() * 0.4),
      size: 0,
      brightness: brightnessBase + Math.random() * 0.3,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleSpeed: CONFIG.twinkleSpeed * (0.6 + Math.random() * 0.8),
      color: '#8ecae6',
      glowColor: 'rgba(142, 202, 230, 0.8)',
      content: frag.body || frag.content || frag.text || '',
      title: frag.title || '',
      time: frag.dateLabel || frag.created_at || frag.timestamp || '',
      threadIds: frag.threadIds || frag.thread_ids || [],
    };
    state.stars.push(star);
    state.fragments.push(star);
  });

  claims.forEach((claim, i) => {
    const angle = (i / Math.max(claims.length, 1)) * Math.PI * 2 + 0.3 + Math.random() * 0.3;
    const radius = maxRadius * (0.7 + Math.random() * 0.25);
    const vad = claim.vad || {};
    const intensity = ((vad.arousal || 0.5) + (vad.dominance || 0.5)) / 2;
    const claimSizeMul = 0.7 + intensity * 0.8;

    const star = {
      id: claim.id || 'claim_' + i,
      type: 'claim',
      x: Math.cos(angle) * radius,
      y: Math.sin(angle) * radius,
      baseSize: CONFIG.claimSize * claimSizeMul * (0.85 + Math.random() * 0.3),
      size: 0,
      brightness: 0.7 + intensity * 0.3 + Math.random() * 0.1,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleSpeed: CONFIG.twinkleSpeed * 0.5,
      color: '#ffd6a5',
      glowColor: 'rgba(255, 214, 165, 0.9)',
      content: claim.body || claim.content || claim.text || claim.statement || '',
      title: claim.title || '',
      time: claim.dateLabel || claim.created_at || '',
      threadIds: claim.threadIds || claim.thread_ids || [],
    };
    state.stars.push(star);
    state.claims.push(star);
  });

  threads.forEach((thread, i) => {
    const fragIds = thread.fragment_ids || thread.members || [];
    if (fragIds.length < 2) return;
    const hue = 260 + (i * 20) % 80;
    const threadColor = 'hsla(' + hue + ', 70%, 75%, ' + CONFIG.threadLineOpacity + ')';
    state.threads.push({
      id: thread.id || 'thread_' + i,
      fragIds: fragIds,
      color: threadColor,
      summary: thread.summary || thread.title || '',
    });
  });

  document.getElementById('count-fragments').textContent = fragments.length;
  document.getElementById('count-threads').textContent = threads.length;
  document.getElementById('count-claims').textContent = claims.length;
}

function getStarById(id) {
  return state.stars.find(s => s.id === id);
}

function worldToScreen(x, y) {
  const cos = Math.cos(state.rotation);
  const sin = Math.sin(state.rotation);
  const rx = x * cos - y * sin;
  const ry = x * sin + y * cos;
  return {
    x: state.centerX + state.offsetX + rx * state.scale,
    y: state.centerY + state.offsetY + ry * state.scale
  };
}

function screenToWorld(sx, sy) {
  const x = (sx - state.centerX - state.offsetX) / state.scale;
  const y = (sy - state.centerY - state.offsetY) / state.scale;
  const cos = Math.cos(-state.rotation);
  const sin = Math.sin(-state.rotation);
  return {
    x: x * cos - y * sin,
    y: x * sin + y * cos
  };
}

function drawStar(star) {
  const pos = worldToScreen(star.x, star.y);
  const size = star.size * state.scale;
  const brightness = star.brightness * (0.7 + 0.3 * Math.sin(star.twinklePhase));

  const glowRadius = size * 12;
  const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, glowRadius);
  gradient.addColorStop(0, star.glowColor);
  gradient.addColorStop(0.15, star.glowColor.replace(/[\d.]+\)/, '0.6)'));
  gradient.addColorStop(0.4, star.glowColor.replace(/[\d.]+\)/, '0.2)'));
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

  ctx.beginPath();
  ctx.arc(pos.x, pos.y, glowRadius, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.globalAlpha = brightness;
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.beginPath();
  ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
  ctx.fillStyle = star.color;
  ctx.shadowColor = star.color;
  ctx.shadowBlur = size * 5;
  ctx.fill();
  ctx.shadowBlur = 0;

  if (star.type === 'claim') {
    const rayLen = size * 6;
    ctx.strokeStyle = star.color;
    ctx.lineWidth = 1.2 * state.scale;
    ctx.globalAlpha = brightness * 0.7;
    ctx.shadowColor = star.color;
    ctx.shadowBlur = size * 2;
    ctx.beginPath();
    ctx.moveTo(pos.x - rayLen, pos.y);
    ctx.lineTo(pos.x + rayLen, pos.y);
    ctx.moveTo(pos.x, pos.y - rayLen);
    ctx.lineTo(pos.x, pos.y + rayLen);
    ctx.moveTo(pos.x - rayLen * 0.7, pos.y - rayLen * 0.7);
    ctx.lineTo(pos.x + rayLen * 0.7, pos.y + rayLen * 0.7);
    ctx.moveTo(pos.x - rayLen * 0.7, pos.y + rayLen * 0.7);
    ctx.lineTo(pos.x + rayLen * 0.7, pos.y - rayLen * 0.7);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

function drawThreads() {
  state.threads.forEach(thread => {
    const points = thread.fragIds.map(id => getStarById(id)).filter(Boolean);
    if (points.length < 2) return;

    ctx.strokeStyle = thread.color;
    ctx.lineWidth = 1.2 * state.scale;
    ctx.beginPath();

    for (let i = 0; i < points.length; i++) {
      const p = worldToScreen(points[i].x, points[i].y);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else {
        const prev = worldToScreen(points[i-1].x, points[i-1].y);
        const mx = (prev.x + p.x) / 2;
        const my = (prev.y + p.y) / 2;
        ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
      }
    }
    ctx.stroke();
  });
}

function drawBackgroundStars() {
  const count = 300;
  for (let i = 0; i < count; i++) {
    const seed = i * 9301 + 49297;
    const x = ((seed * 137) % canvas.width + canvas.width) % canvas.width;
    const y = ((seed * 233) % canvas.height + canvas.height) % canvas.height;
    const size = 0.4 + (seed % 70) / 140;
    const twinkle = 0.3 + 0.5 * Math.sin(state.rotation * 80 + i * 0.5);
    ctx.globalAlpha = twinkle * 0.6;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBackgroundStars();

  state.rotation += CONFIG.rotationSpeed;
  state.scale += (state.targetScale - state.scale) * 0.08;
  state.offsetX += (state.targetOffsetX - state.offsetX) * 0.08;
  state.offsetY += (state.targetOffsetY - state.offsetY) * 0.08;

  drawThreads();

  state.stars.forEach(star => {
    star.twinklePhase += star.twinkleSpeed;
    if (star.size < star.baseSize) {
      star.size += (star.baseSize - star.size) * 0.03;
      if (star.size > star.baseSize) star.size = star.baseSize;
    }
  });

  const sorted = [...state.stars].sort((a, b) => a.size - b.size);
  sorted.forEach(star => drawStar(star));

  requestAnimationFrame(animate);
}

// 交互
const detailEl = document.getElementById('starDetail');

function getStarAt(mx, my) {
  let found = null;
  let minDist = Infinity;
  state.stars.forEach(star => {
    const pos = worldToScreen(star.x, star.y);
    const dx = mx - pos.x;
    const dy = my - pos.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const hitRadius = star.type === 'claim' ? 25 : 15;
    if (dist < hitRadius * state.scale && dist < minDist) {
      minDist = dist;
      found = star;
    }
  });
  return found;
}

let clickStartTime = 0;
let clickStartX = 0, clickStartY = 0;

canvas.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.dragStartX = e.clientX;
  state.dragStartY = e.clientY;
  state.dragStartRot = state.rotation;
  state.dragStartOffsetY = state.targetOffsetY;
  clickStartTime = Date.now();
  clickStartX = e.clientX;
  clickStartY = e.clientY;
});

canvas.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const dx = e.clientX - state.dragStartX;
  const dy = e.clientY - state.dragStartY;
  // 水平拖拽旋转，垂直拖拽平移
  state.rotation = state.dragStartRot + dx * 0.005;
  state.targetOffsetY = state.dragStartOffsetY + dy;
});

canvas.addEventListener('mouseup', (e) => {
  state.isDragging = false;
  const dx = e.clientX - clickStartX;
  const dy = e.clientY - clickStartY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const dt = Date.now() - clickStartTime;
  if (dist < 5 && dt < 300) {
    const star = getStarAt(e.clientX, e.clientY);
    if (star) showDetail(star);
    else closeDetail();
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  state.targetScale = Math.max(0.3, Math.min(3, state.targetScale * delta));
}, { passive: false });

// 触摸支持
let touchStartDist = 0;
let touchStartScale = 1;

canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    state.isDragging = true;
    state.dragStartX = e.touches[0].clientX;
    state.dragStartY = e.touches[0].clientY;
    clickStartTime = Date.now();
    clickStartX = e.touches[0].clientX;
    clickStartY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchStartDist = Math.sqrt(dx * dx + dy * dy);
    touchStartScale = state.targetScale;
  }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && state.isDragging) {
    const dx = e.touches[0].clientX - state.dragStartX;
    const dy = e.touches[0].clientY - state.dragStartY;
    state.rotation = state.dragStartRot + dx * 0.005;
    state.targetOffsetY = state.dragStartOffsetY + dy;
    state.dragStartX = e.touches[0].clientX;
    state.dragStartY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (touchStartDist > 0) {
      state.targetScale = Math.max(0.3, Math.min(3, touchStartScale * (dist / touchStartDist)));
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) {
    state.isDragging = false;
    const changedTouch = e.changedTouches[0];
    const dx = changedTouch.clientX - clickStartX;
    const dy = changedTouch.clientY - clickStartY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const dt = Date.now() - clickStartTime;
    if (dist < 10 && dt < 300) {
      const star = getStarAt(changedTouch.clientX, changedTouch.clientY);
      if (star) showDetail(star);
      else closeDetail();
    }
  }
});

function showDetail(star) {
  state.selectedStar = star;
  const iconEl = document.getElementById('detailIcon');
  const titleEl = document.getElementById('detailTitle');
  const typeEl = document.getElementById('detailType');
  const bodyEl = document.getElementById('detailBody');
  const timeEl = document.getElementById('detailTime');
  const idEl = document.getElementById('detailId');

  iconEl.className = 'star-detail-icon ' + star.type;
  if (star.type === 'fragment') { iconEl.textContent = '✦'; titleEl.textContent = '记忆碎片'; }
  else if (star.type === 'claim') { iconEl.textContent = '★'; titleEl.textContent = '认知论断'; }
  else { iconEl.textContent = '✧'; titleEl.textContent = '线索'; }

  typeEl.textContent = star.type;
  if (star.title && star.title.length > 0 && star.content.indexOf(star.title) !== 0) {
    bodyEl.textContent = star.title + "

" + (star.content || "（无内容）");
  } else {
    bodyEl.textContent = star.content || "（无内容）";
  }
  timeEl.textContent = star.time ? formatTime(star.time) : '';
  idEl.textContent = 'ID: ' + (star.id || '');

  const pos = worldToScreen(star.x, star.y);
  let left = pos.x + 30;
  let top = pos.y - 50;

  if (left + 380 > window.innerWidth) left = pos.x - 390;
  if (left < 10) left = 10;
  if (top + 350 > window.innerHeight) top = window.innerHeight - 370;
  if (top < 10) top = 10;

  detailEl.style.left = left + 'px';
  detailEl.style.top = top + 'px';
  detailEl.classList.add('visible');
}

function closeDetail() {
  detailEl.classList.remove('visible');
  state.selectedStar = null;
}

function formatTime(t) {
  if (!t) return '';
  const d = new Date(t);
  if (isNaN(d.getTime())) return t;
  return d.toLocaleString('zh-CN', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

// 流星
function createShootingStar() {
  const star = document.createElement('div');
  star.className = 'shooting-star';
  const startX = Math.random() * window.innerWidth * 0.5;
  const startY = -20;
  star.style.left = startX + 'px';
  star.style.top = startY + 'px';
  const angle = 35 + Math.random() * 30;
  const distance = 300 + Math.random() * 600;
  const duration = 900 + Math.random() * 700;
  star.style.transform = 'rotate(' + angle + 'deg)';
  document.body.appendChild(star);
  const dx = Math.cos(angle * Math.PI / 180) * distance;
  const dy = Math.sin(angle * Math.PI / 180) * distance;
  star.animate([
    { transform: 'rotate(' + angle + 'deg) translate(0, 0)', opacity: 1 },
    { transform: 'rotate(' + angle + 'deg) translate(' + dx + 'px, ' + dy + 'px)', opacity: 0 }
  ], { duration: duration, easing: 'ease-out', fill: 'forwards' }).onfinish = () => star.remove();
}
setInterval(createShootingStar, CONFIG.shootingStarInterval);

// 加载
async function loadStarmap() {
  const userId = document.getElementById('userIdInput').value.trim();
  if (!userId) return;
  const loading = document.getElementById('loading');
  loading.classList.remove('hidden');
  closeDetail();
  try {
    const data = await fetchState(userId);
    buildStarmap(data);
    state.scale = 1;
    state.targetScale = 1;
    state.offsetX = 0; state.offsetY = 0;
    state.targetOffsetX = 0; state.targetOffsetY = 0;
  } catch (err) {
    console.error('加载失败:', err);
    alert('加载记忆失败：' + err.message + '\n\n请检查userId和token是否正确');
  } finally {
    loading.classList.add('hidden');
  }
}

window.addEventListener("load", () => {
  const params = new URLSearchParams(window.location.search);
  const userId = params.get("userId");
  if (userId) document.getElementById("userIdInput").value = userId;
  const token = params.get("token");
  if (token) document.getElementById("tokenInput").value = token;
  setTimeout(() => { loadStarmap(); }, 500);
});

animate();
</script>
