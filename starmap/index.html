<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>记忆星空 · Memory Starmap</title>
<style>
  :root { color-scheme: dark; --ink:#e8ddf7; --muted:#9e90b5; --pink:#eaa7ec; --violet:#a797f4; --edge:rgba(188,151,227,.15); --side:368px; }
  * { box-sizing:border-box; }
  [hidden] { display:none!important; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#090610; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  button,input,select { font:inherit; }
  button { cursor:pointer; }
  button:disabled { cursor:wait; opacity:.6; }
  button,input,select { -webkit-tap-highlight-color:transparent; }
  button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:2px solid var(--pink); outline-offset:4px; }
  button { color:inherit; }
  #scene { position:absolute; inset:0 var(--side) 0 0; overflow:hidden; background:radial-gradient(ellipse at 54% 44%,#1c102f 0%,#100a1d 45%,#08060e 100%); }
  #sky { width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  .brand { position:absolute; top:38px; left:40px; pointer-events:none; }
  .brand h1 { margin:0; font-size:23px; font-weight:450; letter-spacing:10px; background:linear-gradient(110deg,#d5b9ec,#eca8da 52%,#a9a5ed); background-clip:text; -webkit-background-clip:text; color:transparent; }
  .brand p { margin:11px 0 0; font-size:9px; letter-spacing:4px; color:#a795bc; }
  .edition { display:flex; align-items:center; gap:8px; margin-top:24px; font-size:9px; letter-spacing:2px; color:#7f6a99; }
  .edition::before { content:""; width:20px; height:1px; background:#72578e; }
  .scene-footer { position:absolute; bottom:30px; left:40px; right:34px; display:flex; align-items:end; justify-content:space-between; gap:15px; pointer-events:none; }
  .count { font-size:11px; color:#b5a4ca; letter-spacing:1px; }
  .count b { font-family:Georgia,serif; font-size:25px; font-weight:400; color:#e2c9ef; margin-right:7px; }
  .breakdown { margin-top:8px; display:flex; flex-wrap:wrap; gap:11px; font-size:10px; color:#867595; }
  .scene-tools { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; pointer-events:auto; }
  .quiet-button { background:rgba(31,19,45,.7); border:1px solid var(--edge); border-radius:8px; padding:8px 10px; font-size:11px; color:#bcaace; }
  .quiet-button:hover { background:#30203f; border-color:#68517e; }
  .scene-message { position:absolute; top:48%; left:15%; right:15%; text-align:center; font-size:12px; line-height:2; letter-spacing:2px; color:#a38bb7; pointer-events:none; }
  .scene-message b { display:block; font-size:17px; font-weight:400; color:#d1b7e4; margin-bottom:9px; }
  .sidebar { position:absolute; top:0; right:0; bottom:0; width:var(--side); background:linear-gradient(160deg,rgba(27,17,40,.96),rgba(12,9,20,.98)); border-left:1px solid var(--edge); display:flex; flex-direction:column; box-shadow:-12px 0 45px rgba(10,5,20,.2); }
  .sidebar-header { padding:37px 25px 18px; border-bottom:1px solid var(--edge); flex-shrink:0; }
  .heading-row { display:flex; align-items:center; justify-content:space-between; }
  .heading-row h2 { margin:0; font-size:18px; letter-spacing:5px; font-weight:450; }
  .heading-row small { font:10px Georgia,serif; letter-spacing:2px; color:#867293; }
  .section-caption { margin:9px 0 22px; font-size:9px; letter-spacing:2px; color:#80718e; }
  .filters { display:flex; gap:5px; flex-wrap:wrap; }
  .filter { padding:6px 10px; border:1px solid transparent; border-radius:16px; background:transparent; color:#a997bf; font-size:11px; }
  .filter:hover { background:rgba(144,98,183,.1); }
  .filter[aria-pressed="true"] { color:#f3e4ff; border-color:#8862ad; background:linear-gradient(115deg,#68448c,#493363); box-shadow:inset 0 1px rgba(255,255,255,.12); }
  .sort-row { margin-top:17px; display:flex; align-items:center; justify-content:space-between; gap:9px; color:#897599; font-size:10px; }
  .sort-row select { min-width:0; background:#1c1429; border:1px solid var(--edge); color:#b7a1cc; border-radius:7px; padding:5px 8px; font-size:10px; }
  #sortNote { margin:9px 0 0; font-size:10px; line-height:1.6; color:#887697; }
  #memoryList { flex:1; min-height:0; overflow-y:auto; padding:18px 18px 24px; scrollbar-width:thin; scrollbar-color:#4a355f transparent; }
  .memory-card { display:block; width:100%; text-align:left; padding:17px 16px 14px; margin:0 0 11px; color:var(--ink); border:1px solid rgba(168,129,207,.12); border-radius:12px; background:linear-gradient(120deg,rgba(96,66,122,.12),rgba(52,35,70,.08)); transition:border-color .2s,background .2s; }
  .memory-card:hover { background:rgba(100,65,137,.17); border-color:rgba(179,127,226,.35); }
  .memory-card[aria-pressed="true"] { border-color:#b486d2; background:linear-gradient(130deg,rgba(124,73,151,.26),rgba(66,43,103,.23)); box-shadow:inset 3px 0 #d39de3; }
  .card-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:11px; color:#9780ae; font-size:9px; letter-spacing:.7px; }
  .type-label { display:flex; align-items:center; gap:6px; }
  .type-dot { display:inline-block; width:4px; height:4px; border-radius:50%; background:var(--star-color); box-shadow:0 0 7px var(--star-color); flex-shrink:0; }
  .card-title { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin:0; font-size:13px; font-weight:450; line-height:1.7; color:#dacee9; }
  .card-excerpt { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin:7px 0 0; color:#a18eaf; font-size:11px; line-height:1.8; }
  .tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:11px; }
  .tag { display:inline-block; font-size:9px; line-height:1.5; color:#b8a1d9; background:rgba(140,93,188,.13); padding:3px 7px; border-radius:5px; max-width:100%; overflow-wrap:anywhere; }
  .card-measure { display:block; margin-top:10px; color:#9681ac; font-size:10px; }
  .list-empty { text-align:center; padding:42px 14px; line-height:2; font-size:12px; color:#9683a8; }
  #listNav { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 20px; border-top:1px solid var(--edge); font-size:10px; color:var(--muted); flex-shrink:0; }
  #listNav button { padding:6px 9px; }
  .connection { padding:14px 22px 18px; border-top:1px solid var(--edge); background:rgba(10,6,17,.28); flex-shrink:0; font-size:11px; }
  .connection summary { cursor:pointer; color:#ad97bf; display:flex; align-items:center; justify-content:space-between; list-style:none; padding:2px 0; }
  .connection summary::-webkit-details-marker { display:none; }
  .connection summary::after { content:"＋"; color:#977eac; }
  .connection[open] summary::after { content:"−"; }
  #connectionStatus { font-size:10px; color:#8f7c9f; margin-left:12px; }
  #connectionForm { padding-top:14px; display:grid; grid-template-columns:1fr auto; gap:10px; }
  #connectionForm label { display:block; grid-column:1/-1; color:#a48bb8; font-size:10px; }
  #connectionForm input { display:block; width:100%; background:#110c1b; border:1px solid #392844; color:#e4d3f0; border-radius:6px; padding:8px 10px; margin-top:6px; font-size:12px; }
  #connectionForm p { grid-column:1/-1; margin:0; color:#82708f; font-size:10px; line-height:1.7; }
  #refreshButton { grid-column:1/-1; }
  #errorMessage { color:#edb6d3; line-height:1.7; margin:10px 0 0; font-size:11px; overflow-wrap:anywhere; }
  #panelToggle { position:absolute; right:var(--side); top:48%; z-index:5; border:1px solid #493059; border-right:0; background:rgba(43,25,64,.9); color:#bfa4d6; border-radius:9px 0 0 9px; writing-mode:vertical-rl; letter-spacing:3px; padding:17px 8px; font-size:10px; }
  body.panel-closed { --side:0px; }
  body.panel-closed .sidebar { display:none; }
  #tooltip { position:absolute; z-index:8; max-width:250px; padding:13px 15px; border:1px solid #644675; border-radius:9px; background:rgba(24,14,37,.96); box-shadow:0 8px 30px #08040e55; pointer-events:none; }
  #tooltip .tip-type { display:block; color:#c292d7; font-size:9px; letter-spacing:2px; margin-bottom:6px; }
  #tooltip strong { font-size:12px; font-weight:450; line-height:1.5; display:block; }
  #tooltip p { font-size:11px; line-height:1.7; color:#b29ac5; margin:6px 0 0; }
  .detail { flex-shrink:0; max-height:46%; overflow-y:auto; padding:20px 23px; border-top:1px solid #6b467e; background:linear-gradient(125deg,#251530,#161021); scrollbar-width:thin; scrollbar-color:#4a355f transparent; }
  .detail-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  #detailType { font-size:9px; color:#c799dd; letter-spacing:2px; }
  #detailTitle { font-size:15px; line-height:1.8; font-weight:450; margin:10px 0; overflow-wrap:anywhere; }
  #detailDate { color:#9f87af; font-size:10px; }
  #detailBody { font-size:12px; line-height:1.9; color:#c4afd1; white-space:pre-wrap; overflow-wrap:anywhere; margin:12px 0; }
  #detailExtra { white-space:pre-wrap; font-size:11px; line-height:1.8; color:#a98fb9; }
  #detailMeter { width:100%; height:3px; accent-color:#d99fe6; display:block; margin-top:8px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  @media (min-width:1500px) { :root { --side:400px; } .sidebar-header { padding-top:43px; } .brand { left:48px; top:43px; } }
  @media (max-width:1050px) and (min-width:761px) { :root { --side:320px; } .brand { left:26px; } .scene-footer { left:26px; right:20px; } .scene-tools { flex-direction:column; } }
  @media (max-width:760px) {
    :root { --side:0px; }
    #scene { bottom:46%; }
    .brand { left:22px; top:23px; }
    .brand h1 { font-size:19px; letter-spacing:7px; }
    .brand p { font-size:8px; letter-spacing:3px; margin-top:8px; }
    .edition { display:none; }
    .scene-footer { left:22px; bottom:37px; right:18px; }
    .count b { font-size:21px; }
    .breakdown { font-size:9px; gap:7px; }
    .scene-tools { max-width:160px; gap:5px; }
    .scene-tools .quiet-button { padding:7px; font-size:10px; }
    .sidebar { top:54%; width:100%; border-left:0; border-top:1px solid var(--edge); }
    .sidebar-header { padding:15px 20px 11px; }
    .heading-row h2 { font-size:15px; letter-spacing:3px; }
    .section-caption { display:none; }
    .filters { margin-top:12px; }
    .sort-row { margin-top:10px; }
    #sortNote { margin-top:5px; }
    #memoryList { padding:12px 16px; }
    .connection { padding:10px 18px; }
    #panelToggle { writing-mode:horizontal-tb; top:calc(54% - 27px); right:0; border-radius:8px 0 0 0; padding:6px 12px; font-size:10px; }
    body.panel-closed #scene { bottom:0; }
    body.panel-closed #panelToggle { top:auto; bottom:88px; }
    .detail { position:absolute; inset:0; max-height:none; z-index:3; padding:18px 22px; }
    .connection[open] { position:absolute; inset:0; z-index:4; background:#170e22; overflow:auto; }
  }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
</style>
</head>
<body>
<main id="scene" aria-label="记忆星空">
  <canvas id="sky" tabindex="0" aria-label="动态记忆星图，可拖动旋转、滚轮缩放、双击空白复位，也可通过右侧记忆列表选择相同内容"></canvas>
  <header class="brand"><h1>记忆星空</h1><p>MEMORY · STARMAP</p><div class="edition">每一颗星，都是记得的瞬间</div></header>
  <div class="scene-message" id="sceneMessage" role="status">正在连接你的记忆星空…</div>
  <div class="scene-footer">
    <div><div class="count"><b id="visibleCount">0</b><span id="countLabel">颗记忆星辰</span></div><div class="breakdown"><span id="countFragments">0 碎片</span><span id="countThreads">0 线索</span><span id="countClaims">0 认知</span></div></div>
    <div class="scene-tools"><button class="quiet-button" id="resetView" type="button" title="恢复默认视角（画布获得焦点时也可按 Home）">复位 · <span id="zoomValue">100%</span></button><button class="quiet-button" id="motionButton" type="button" aria-pressed="false">暂停动态</button><button class="quiet-button" id="connectionButton" type="button">连接设置</button></div>
  </div>
  <div id="tooltip" hidden role="tooltip"><span class="tip-type" id="tipType"></span><strong id="tipTitle"></strong><p id="tipBody"></p></div>
</main>
<button id="panelToggle" type="button" aria-expanded="true" aria-controls="sidebar">收起列表 ›</button>
<aside class="sidebar" id="sidebar" aria-label="全部记忆列表">
  <header class="sidebar-header">
    <div class="heading-row"><h2>全部记忆</h2><small id="listTotal">00</small></div>
    <p class="section-caption">THE CONSTELLATION OF YOU</p>
    <div class="filters" role="group" aria-label="记忆类型">
      <button class="filter" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter" data-filter="fragment" aria-pressed="false">记忆碎片</button>
      <button class="filter" data-filter="thread" aria-pressed="false">线索</button>
      <button class="filter" data-filter="claim" aria-pressed="false">认知</button>
    </div>
    <div class="sort-row"><label for="sortSelect">排列方式</label><select id="sortSelect"><option value="time">按时间 · 最近优先</option><option value="emotion">按情绪强度 · 碎片优先</option></select></div>
    <p id="sortNote">缺少完整日期的记忆排在后面。</p>
  </header>
  <div id="memoryList" aria-label="记忆卡片"></div>
  <nav id="listNav" hidden aria-label="列表分页"><button class="quiet-button" id="prevPage">上一页</button><span id="pageLabel"></span><button class="quiet-button" id="nextPage">下一页</button></nav>
  <section class="detail" id="detailPanel" hidden aria-label="选中记忆详情">
    <div class="detail-head"><span id="detailType"></span><button class="quiet-button" id="closeDetail" aria-label="关闭记忆详情">关闭 ×</button></div>
    <h3 id="detailTitle"></h3><div id="detailDate"></div><div id="detailBody"></div><div class="tags" id="detailTags"></div><div id="detailExtra"></div><progress id="detailMeter" max="1" hidden aria-label="认知置信度"></progress>
  </section>
  <details class="connection" id="connectionPanel">
    <summary><span>连接与访问<span id="connectionStatus">未连接</span></span></summary>
    <form id="connectionForm">
      <label>用户 ID<input id="userIdInput" type="text" value="muqiu" placeholder="muqiu" autocomplete="off" /></label>
      <label>访问令牌<input id="tokenInput" type="password" placeholder="auth token（可选）" autocomplete="off" /></label>
      <p>令牌沿用浏览器本地保存，仅发送给当前站点的 API 代理。</p>
      <button class="quiet-button" id="refreshButton" type="submit">连接 / 刷新记忆</button>
    </form>
    <p id="errorMessage" hidden role="alert"></p>
  </details>
</aside>
<div class="sr-only" id="selectionAnnouncement" aria-live="polite"></div>
<script>
'use strict';
// 1. Existing API contract: same-origin /v1/state + userId + optional Bearer token.
const API_BASE = '';
let userId = 'muqiu', authToken = '';
let fragments = [], threads = [], claims = [];
function fetchJson(url, opts) {
  const headers = { 'Content-Type': 'application/json', ...(opts?.headers || {}) };
  if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
  return fetch(url, { ...opts, headers }).then(r => {
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    return r.json();
  });
}
function getApiBase() { return API_BASE; }
const $ = id => document.getElementById(id);
function remember(key, value) { try { localStorage.setItem(key, value); } catch {} }
function recall(key) { try { return localStorage.getItem(key); } catch { return null; } }
let requestVersion = 0, requestController, loaded = false, loading = false;
async function loadData() {
  const version = ++requestVersion;
  requestController?.abort(); requestController = new AbortController();
  const nextUser = $('userIdInput').value.trim() || 'muqiu';
  const changedUser = nextUser !== userId;
  userId = nextUser; authToken = $('tokenInput').value || '';
  remember('twig_user_id', userId); remember('twig_auth_token', authToken);
  $('userIdInput').value = userId;
  loading = true;
  $('refreshButton').disabled = true; $('refreshButton').textContent = '正在连接…';
  $('connectionStatus').textContent = '连接中'; $('errorMessage').hidden = true;
  if (changedUser) { fragments=[]; threads=[]; claims=[]; loaded=false; closeSelection(); buildEntries(); applyView(); }
  updateMessage();
  try {
    const data = await fetchJson(getApiBase() + '/v1/state?userId=' + encodeURIComponent(userId), { signal:requestController.signal });
    if (version !== requestVersion) return;
    if (!data || !['fragments','threads','claims'].every(k => Array.isArray(data[k]))) throw new Error('记忆数据格式不正确');
    fragments=data.fragments; threads=data.threads; claims=data.claims; loaded=true;
    buildEntries(); applyView();
    if (selectedKey && entryMap.has(selectedKey)) showDetail(entryMap.get(selectedKey));
    $('connectionStatus').textContent = '已连接';
  } catch (error) {
    if (version !== requestVersion || error.name === 'AbortError') return;
    $('connectionStatus').textContent = loaded ? '刷新失败 · 显示上次数据' : '连接失败';
    $('errorMessage').textContent = '加载失败：' + error.message + '。请检查用户 ID、令牌或服务连接。';
    $('errorMessage').hidden = false; $('connectionPanel').open = true;
  } finally {
    if (version === requestVersion) {
      loading=false; $('refreshButton').disabled=false; $('refreshButton').textContent='连接 / 刷新记忆';
      updateMessage(); invalidate();
    }
  }
}

// 2. Read-only view models. No invented importance score or write-back to API data.
const TYPES = {
  fragment:{label:'记忆碎片',en:'FRAGMENT',color:'#d9a1ef',rgb:'217,161,239'},
  thread:{label:'线索星座',en:'THREAD',color:'#aaa0ff',rgb:'170,160,255'},
  claim:{label:'认知亮星',en:'CLAIM',color:'#f0a0d3',rgb:'240,160,211'},
};
const unit = v => typeof v === 'number' && Number.isFinite(v) ? Math.max(0,Math.min(1,v)) : null;
const percent = v => unit(v) === null ? '未提供' : Math.round(unit(v)*100)+'%';
const text = v => v == null ? '' : String(v);
const array = v => Array.isArray(v) ? v : [];
function fullDate(v) {
  if (typeof v !== 'string' || !/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(v)) return null;
  const n=Date.parse(v); return Number.isFinite(n)?n:null;
}
function latest(values) { const valid=values.filter(v=>v!==null); return valid.length?Math.max(...valid):null; }
let entries=[], entryMap=new Map(), filtered=[], fieldEntries=[], selectedKey=null;
let filter='all', sort='time', pageIndex=0;
const PAGE_SIZE=36;
function buildEntries() {
  const byFragment=new Map(fragments.map(f=>[String(f.id),f]));
  const old=new Map(entries.map(e=>[e.key,e]));
  entries=[];
  const add=(type,data,index,title,body,date,emotion,tags)=>{
    if (!data || data.id == null) return;
    const key=type+':'+String(data.id), meta=TYPES[type];
    const e={key,type,data,title:text(title),body:text(body),date,emotion,tags:array(tags),index,meta};
    e.orbit=old.get(key)?.orbit || makeOrbit(key);
    entries.push(e);
  };
  fragments.forEach((f,i)=>add('fragment',f,i,f.title||'无题记忆',f.body||'',fullDate(f.dateLabel),unit(f.vad?.arousal),f.tags));
  threads.forEach((t,i)=>add('thread',t,i,t.label||t.id,t.openQuestion||'一条正在延续的线索',
    latest(array(t.history).map(h=>fullDate(byFragment.get(String(h.fragmentId))?.dateLabel))),null,[]));
  claims.forEach((c,i)=>add('claim',c,i,c.docTitle||c.text||c.id,c.text||'',
    latest(array(c.versions).map(v=>fullDate(v.at))),null,[]));
  entryMap=new Map(entries.map(e=>[e.key,e]));
}
function applyView() {
  filtered=entries.filter(e=>filter==='all'||e.type===filter);
  filtered.sort((a,b)=>{
    const av=sort==='emotion'?a.emotion:a.date, bv=sort==='emotion'?b.emotion:b.date;
    if(av===null&&bv!==null)return 1;if(av!==null&&bv===null)return -1;
    return (bv??0)-(av??0)||a.key.localeCompare(b.key);
  });
  // Rendering order is independent from list order, keeping orbits stable.
  fieldEntries=entries.filter(e=>filter==='all'||e.type===filter);
  if(selectedKey&&!fieldEntries.some(e=>e.key===selectedKey))closeSelection();
  pageIndex=Math.min(pageIndex,Math.max(0,Math.ceil(filtered.length/PAGE_SIZE)-1));
  document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));
  $('sortNote').textContent=sort==='emotion'?'仅按碎片的唤醒强度排序；其他类型与缺失值置后。':'线索按关联碎片、认知按版本更新时间；无完整日期置后。';
  $('visibleCount').textContent=filtered.length;
  $('countLabel').textContent=filter==='all'?'颗记忆星辰':' / '+entries.length+' 颗记忆星辰';
  $('listTotal').textContent=String(filtered.length).padStart(2,'0');
  $('countFragments').textContent=fragments.length+' 碎片';
  $('countThreads').textContent=threads.length+' 线索';
  $('countClaims').textContent=claims.length+' 认知';
  renderList(); updateMessage(); hideTooltip(); invalidate();
}
function node(tag,cls,content) { const n=document.createElement(tag);if(cls)n.className=cls;if(content!=null)n.textContent=content;return n; }
function dateLabel(e) {

      ctx.globalAlpha=s.alpha*horizon*reveal(soft?1:.1,soft?2.5:1.4)*(soft&&!paused&&!reduced?.92+.08*Math.sin(clock*.15+s.phase):1);
      const size=s.size*Math.min(kz,1.3);
      if(soft){const radius=size*6;ctx.drawImage(backgroundLayers.dot,x-radius/2,y-radius/2,radius,radius);}
      else ctx.fillRect(x,y,size,size);
    }
  };
  const farCount=Math.round(Math.min(7200,Math.max(3600,W*H/150))*backgroundQuality);
  paint(backgroundLayers.far,.065,farCount,false);
  paint(backgroundLayers.mid,.21,Math.round(260*backgroundQuality),true);
  ctx.globalAlpha=1;
}
function drawFrame(now){
  raf=0;if(document.hidden)return;
  if(openingActive){
    openingTime=Math.min(4,(now-openingStart)/1000);
    if(reduced||paused||openingTime>=4){finishOpening();if(!reduced&&!paused&&selectedKey)focusPulse=.45;}
    else brand.style.opacity=String(reveal(2.5,4));
  }
  const moving=!paused&&!reduced;
  if(frameStep&&now-paintedAt<frameStep&&!dirty){raf=requestAnimationFrame(drawFrame);return;}
  const dt=lastFrame?Math.min((now-lastFrame)/1000,.05):1/60;lastFrame=now;
  const started=performance.now();paintedAt=now;
  if(moving)clock+=dt;
  const cameraMoving=updateCamera(dt,now);
  drawBackground();
  const transform=cameraTransform(),view=viewport();
  projected=fieldEntries.map(e=>project(e,transform,view));
  // Back-to-front drawing and the same final screen-space coordinates for hit testing.
  projected.sort((a,b)=>a.z-b.z);
  const selected=entryMap.get(selectedKey),selectedPoint=projected.find(p=>p.e.key===selectedKey);
  if(selected&&selectedPoint){
    const ids=selected.type==='thread'?array(selected.data.history).map(h=>'fragment:'+h.fragmentId):selected.type==='claim'?array(selected.data.evidenceIds).map(id=>'fragment:'+id):array(selected.data.threadIds).map(id=>'thread:'+id);
    ctx.globalAlpha=reveal(2.5,4);ctx.strokeStyle='rgba(186,140,228,.19)';ctx.lineWidth=.7;const related=new Set(ids.slice(0,24));
    ctx.beginPath();for(const q of projected)if(related.has(q.e.key)){ctx.moveTo(selectedPoint.x,selectedPoint.y);ctx.lineTo(q.x,q.y);}ctx.stroke();
  }
  for(const p of projected){
    if(!p.visible)continue;
    const e=p.e,v=e.visual,twinkle=moving?.9+.1*Math.sin(clock*e.orbit.frequency+e.orbit.twinkle):1;
    const arrival=2.5+(1-clamp((v.size-25)/60,0,1))*.45+(hash(e.key)%101)/101*.25;
    ctx.globalAlpha=clamp(v.alpha*twinkle*(.9+p.z*.08),.35,1)*reveal(arrival,Math.min(4,arrival+.8));
    // Keep every memory's ray sprite. Budget reductions affect decoration first.
    ctx.drawImage(sprite(e.type),p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
  if(selectedPoint?.visible){ctx.globalAlpha=reveal(3.5,4);ctx.strokeStyle='rgba(229,182,246,.44)';ctx.lineWidth=.7;ctx.beginPath();ctx.arc(selectedPoint.x,selectedPoint.y,selectedPoint.size*.34+focusPulse*9,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
  if(focusPulse>0)focusPulse=Math.max(0,focusPulse-dt*1.25);
  const hit=pointer.inside&&!dragState?.dragging?hitTest(pointer.x,pointer.y):null;
  if(hit?.e.key!==hoverKey){hoverKey=hit?.e.key||null;if(hit)showTooltip(hit.e);else hideTooltip();}
  canvas.style.cursor=dragState?.dragging?'grabbing':hit?'pointer':'grab';
  if(hit)positionTooltip();
  dirty=false;
  if(performance.now()-started>22){
    slowFrames++;if(slowFrames>35){if(backgroundQuality>.4)backgroundQuality=.4;else frameStep=1000/30;slowFrames=0;}
  }else slowFrames=Math.max(0,slowFrames-1);
  if(moving||cameraMoving||focusPulse>0||openingActive)raf=requestAnimationFrame(drawFrame);
}
function invalidate(){dirty=true;if(!raf&&!document.hidden)raf=requestAnimationFrame(drawFrame);}
function hitTest(x,y){
  let found=null,best=Infinity;
  for(let i=projected.length-1;i>=0;i--){
    const p=projected[i];if(!p.visible||p.x<0||p.x>W||p.y<0||p.y>H)continue;
    const d=(p.x-x)**2+(p.y-y)**2;
    if(d<p.hitRadius*p.hitRadius&&d<best-1){found=p;best=d;}
  }
  return found;
}
function showTooltip(e){$('tipType').textContent=e.meta.label;$('tipTitle').textContent=e.title.slice(0,65);$('tipBody').textContent=e.body.slice(0,100)+(e.body.length>100?'…':'');$('tooltip').hidden=false;}
function positionTooltip(){const tip=$('tooltip');const x=Math.max(8,Math.min(W-tip.offsetWidth-8,pointer.x+19)),y=Math.max(8,Math.min(H-tip.offsetHeight-8,pointer.y+19));tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTooltip(){$('tooltip').hidden=true;hoverKey=null;canvas.style.cursor=dragState?.dragging?'grabbing':'grab';}
function setPointer(event){const r=canvas.getBoundingClientRect();pointer.x=event.clientX-r.left;pointer.y=event.clientY-r.top;pointer.inside=pointer.x>=0&&pointer.x<=W&&pointer.y>=0&&pointer.y<=H;}
canvas.addEventListener('wheel',event=>{
  if(event.ctrlKey)return; // Preserve browser accessibility/pinch zoom.
  event.preventDefault();if(dragState)return;
  setPointer(event);
  const delta=clamp(event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?H:1),-160,160);
  zoomAt(pointer.x,pointer.y,Math.exp(-delta*.0017));
},{passive:false});
canvas.addEventListener('pointerdown',event=>{
  if(event.button!==0||!event.isPrimary)return;
  setPointer(event);cancelCameraTransition();suppressClick=false;
  dragState={id:event.pointerId,startX:pointer.x,startY:pointer.y,lastX:pointer.x,lastY:pointer.y,time:performance.now(),dragging:false,vYaw:0,vPitch:0};
  canvas.setPointerCapture(event.pointerId);invalidate();
});
canvas.addEventListener('pointermove',event=>{
  setPointer(event);
  if(dragState&&dragState.id===event.pointerId){
    const d=dragState,now=performance.now(),elapsed=Math.max(.008,(now-d.time)/1000);
    if(Math.hypot(pointer.x-d.startX,pointer.y-d.startY)>6)d.dragging=true;
    if(d.dragging){
      const dx=pointer.x-d.lastX,dy=pointer.y-d.lastY;
      const yawDelta=dx*.004,pitchDelta=dy*.0024;
      cameraTarget.yaw+=yawDelta;
      cameraTarget.pitch=clamp(cameraTarget.pitch+pitchDelta,-CAMERA_LIMITS.pitch,CAMERA_LIMITS.pitch);
      d.vYaw=clamp(yawDelta/elapsed,-.28,.28);d.vPitch=clamp(pitchDelta/elapsed,-.16,.16);
      hideTooltip();
      if(paused||reduced)updateCamera(0,now);
    }
    d.lastX=pointer.x;d.lastY=pointer.y;d.time=now;
  }
  invalidate();
});
function endDrag(event,cancelled=false){
  if(!dragState||dragState.id!==event.pointerId)return;
  const d=dragState;dragState=null;
  if(d.dragging||cancelled){
    suppressClick=true;lastDragAt=performance.now();
    if(!cancelled&&!paused&&!reduced&&performance.now()-d.time<100){angularVelocity.yaw=d.vYaw;angularVelocity.pitch=d.vPitch;}
  }
  if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId);
  if(event.pointerType==='touch'){pointer.inside=false;hideTooltip();}
  invalidate();
}
canvas.addEventListener('pointerup',e=>endDrag(e));
canvas.addEventListener('pointercancel',e=>endDrag(e,true));
canvas.addEventListener('lostpointercapture',e=>endDrag(e,true));
canvas.addEventListener('pointerleave',()=>{pointer.inside=false;hideTooltip();invalidate();});
canvas.addEventListener('click',event=>{
  if(suppressClick){suppressClick=false;return;}
  setPointer(event);const p=hitTest(pointer.x,pointer.y);
  if(p)selectEntry(p.e.key,'star');else closeSelection();
  if(event.pointerType==='touch'){pointer.inside=false;hideTooltip();}
});
canvas.addEventListener('dblclick',event=>{
  setPointer(event);
  if(performance.now()-lastDragAt>350&&!hitTest(pointer.x,pointer.y))resetCamera();
});
canvas.addEventListener('keydown',event=>{
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','Home'].includes(event.key))return;
  event.preventDefault();
  if(event.key==='Home'){resetCamera();return;}
  if(['+','=','-'].includes(event.key)){const v=viewport();zoomAt(v.cx,v.cy,event.key==='-'?.87:1.15);return;}
  cancelCameraTransition();
  cameraTarget.yaw=camera.yaw+(event.key==='ArrowLeft'?-.1:event.key==='ArrowRight'?.1:0);
  cameraTarget.pitch=clamp(camera.pitch+(event.key==='ArrowUp'?-.07:event.key==='ArrowDown'?.07:0),-CAMERA_LIMITS.pitch,CAMERA_LIMITS.pitch);
  if(paused||reduced)updateCamera(0,performance.now());invalidate();
});
$('resetView').addEventListener('click',resetCamera);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){cancelAnimationFrame(raf);raf=0;angularVelocity.yaw=angularVelocity.pitch=0;focusTransition=null;if(dragState)endDrag({pointerId:dragState.id},true);}
  else{lastFrame=0;invalidate();}
});
function motionLabel(){$('motionButton').textContent=reduced?'系统已减少动态':paused?'继续动态':'暂停动态';$('motionButton').disabled=reduced;$('motionButton').setAttribute('aria-pressed',String(paused||reduced));}
function stopAmbient(){focusPulse=0;cancelCameraTransition();}
media.addEventListener('change',()=>{reduced=media.matches;if(reduced)stopAmbient();lastFrame=0;motionLabel();invalidate();});
$('motionButton').addEventListener('click',()=>{paused=!paused;if(paused)stopAmbient();lastFrame=0;motionLabel();invalidate();});
new ResizeObserver(resize).observe($('scene'));
window.addEventListener('resize',resize);

// 4. Accessible DOM controls, rendering state is local to this page.
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;pageIndex=0;applyView();$('memoryList').scrollTop=0;}));
$('sortSelect').addEventListener('change',e=>{sort=e.target.value;pageIndex=0;applyView();$('memoryList').scrollTop=0;});
$('prevPage').addEventListener('click',()=>{pageIndex--;renderList();$('memoryList').scrollTop=0;});
$('nextPage').addEventListener('click',()=>{pageIndex++;renderList();$('memoryList').scrollTop=0;});
$('panelToggle').addEventListener('click',()=>setPanel(document.body.classList.contains('panel-closed')));
$('closeDetail').addEventListener('click',()=>{closeSelection();renderList();});
$('connectionButton').addEventListener('click',()=>{setPanel(true);$('connectionPanel').open=true;$('userIdInput').focus();});
$('connectionForm').addEventListener('submit',e=>{e.preventDefault();loadData();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSelection();$('connectionPanel').open=false;hideTooltip();renderList();}});
$('userIdInput').value=recall('twig_user_id')||'muqiu';$('tokenInput').value=recall('twig_auth_token')||'';
resize();motionLabel();loadData();invalidate();
</script>
</body>
