<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆星空 · Twig Starmap</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #05051a; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #fff; cursor: default; }
#starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
.bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 20% 30%, rgba(100, 80, 200, 0.25) 0%, transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(60, 120, 200, 0.2) 0%, transparent 50%), radial-gradient(ellipse at 50% 50%, rgba(180, 100, 180, 0.1) 0%, transparent 60%), linear-gradient(180deg, #05051a 0%, #0a0a2a 50%, #050515 100%); }
.nebula { position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.5; z-index: 0; pointer-events: none; }
.nebula-1 { width: 700px; height: 700px; background: radial-gradient(circle, rgba(138, 99, 210, 0.5) 0%, transparent 65%); top: -150px; left: -100px; animation: drift1 40s ease-in-out infinite; }
.nebula-2 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(79, 156, 210, 0.4) 0%, transparent 65%); bottom: -100px; right: -80px; animation: drift2 35s ease-in-out infinite; }
.nebula-3 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(255, 180, 220, 0.3) 0%, transparent 65%); top: 50%; left: 40%; animation: drift3 45s ease-in-out infinite; }
@keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(100px, 80px) scale(1.15);} }
@keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(-80px, -60px) scale(0.9);} }
@keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(-60px, 70px) scale(1.1);} }
.header { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; pointer-events: none; }
.header h1 { font-size: 36px; font-weight: 200; letter-spacing: 12px; background: linear-gradient(135deg, #e0d4ff 0%, #a8d8ff 40%, #ffc8e0 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-shadow: 0 0 60px rgba(180, 160, 255, 0.4); }
.header p { margin-top: 10px; font-size: 12px; letter-spacing: 6px; color: rgba(255,255,255,0.3); }
.stats { position: fixed; top: 40px; right: 40px; z-index: 10; background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 20px 24px; min-width: 160px; }
.stats-item { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.stats-item:last-child { margin-bottom: 0; }
.stats-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.stats-dot.fragment { background: #8ecae6; box-shadow: 0 0 10px #8ecae6, 0 0 20px rgba(142,202,230,0.5); }
.stats-dot.thread { background: #c9b8ff; box-shadow: 0 0 10px #c9b8ff, 0 0 20px rgba(201,184,255,0.5); }
.stats-dot.claim { background: #ffd6a5; box-shadow: 0 0 12px #ffd6a5, 0 0 25px rgba(255,214,165,0.6); }
.stats-label { font-size: 13px; color: rgba(255,255,255,0.5); flex: 1; }
.stats-value { font-size: 20px; font-weight: 300; color: #fff; }
  <script>
  const canvas = document.getElementById('starfield')
  const ctx = canvas.getContext('2d')
  
  let W, H
  let stars = []
  let bgStars = []
  let shootingStars = []
  let threads = []
  let claims = []
  let loaded = false
  
  // 视图控制
  let scale = 1
  let offsetX = 0
  let offsetY = 0
  let isDragging = false
  let lastX, lastY
  
  function resize() {
    W = canvas.width = window.innerWidth * devicePixelRatio
    H = canvas.height = window.innerHeight * devicePixelRatio
    canvas.style.width = window.innerWidth + 'px'
    canvas.style.height = window.innerHeight + 'px'
  }
  resize()
  window.addEventListener('resize', resize)
  
  // 生成背景远景星
  function generateBgStars() {
    bgStars = []
    for (let i = 0; i < 150; i++) {
      bgStars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: (Math.random() * 0.8 + 0.3) * devicePixelRatio,
        opacity: Math.random() * 0.5 + 0.1,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        twinklePhase: Math.random() * Math.PI * 2
      })
    }
  }
  generateBgStars()
  
  // 绘制十字星光
  function drawStarGlow(x, y, size, color, intensity = 1) {
    ctx.save()
    ctx.translate(x, y)
    
    // 主光晕
    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 8)
    gradient.addColorStop(0, `rgba(${color}, ${0.4 * intensity})`)
    gradient.addColorStop(0.3, `rgba(${color}, ${0.15 * intensity})`)
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)')
    ctx.fillStyle = gradient
    ctx.beginPath()
    ctx.arc(0, 0, size * 8, 0, Math.PI * 2)
    ctx.fill()
    
    // 十字射线
    ctx.globalCompositeOperation = 'lighter'
    const rayLength = size * 15
    const rayWidth = size * 0.8
    
    // 水平射线
    const hGrad = ctx.createLinearGradient(-rayLength, 0, rayLength, 0)
    hGrad.addColorStop(0, 'rgba(255, 255, 255, 0)')
    hGrad.addColorStop(0.5, `rgba(255, 255, 255, ${0.6 * intensity})`)
    hGrad.addColorStop(1, 'rgba(255, 255, 255, 0)')
    ctx.fillStyle = hGrad
    ctx.fillRect(-rayLength, -rayWidth / 2, rayLength * 2, rayWidth)
    
    // 垂直射线
    const vGrad = ctx.createLinearGradient(0, -rayLength, 0, rayLength)
    vGrad.addColorStop(0, 'rgba(255, 255, 255, 0)')
    vGrad.addColorStop(0.5, `rgba(255, 255, 255, ${0.6 * intensity})`)
    vGrad.addColorStop(1, 'rgba(255, 255, 255, 0)')
    ctx.fillStyle = vGrad
    ctx.fillRect(-rayWidth / 2, -rayLength, rayWidth, rayLength * 2)
    
    // 核心
    ctx.globalCompositeOperation = 'source-over'
    const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size)
    coreGrad.addColorStop(0, '#ffffff')
    coreGrad.addColorStop(0.5, `rgba(${color}, 1)`)
    coreGrad.addColorStop(1, `rgba(${color}, 0.3)`)
    ctx.fillStyle = coreGrad
    ctx.beginPath()
    ctx.arc(0, 0, size, 0, Math.PI * 2)
    ctx.fill()
    
    ctx.restore()
  }
  
  // 流星
  function createShootingStar() {
    const side = Math.random() > 0.5 ? 'top' : 'left'
    let x, y, vx, vy
    const speed = 8 + Math.random() * 6
    
    if (side === 'top') {
      x = Math.random() * W
      y = -10
      vx = speed * 0.5
      vy = speed
    } else {
      x = -10
      y = Math.random() * H * 0.5
      vx = speed
      vy = speed * 0.3
    }
    
    shootingStars.push({ x, y, vx, vy, length: 80 + Math.random() * 60, life: 1 })
  }
  
  function updateShootingStars() {
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i]
      s.x += s.vx * devicePixelRatio
      s.y += s.vy * devicePixelRatio
      s.life -= 0.015
      if (s.life <= 0 || s.x > W + 100 || s.y > H + 100) {
        shootingStars.splice(i, 1)
      }
    }
  }
  
  function drawShootingStars() {
    ctx.save()
    ctx.globalCompositeOperation = 'lighter'
    for (const s of shootingStars) {
      const tailX = s.x - s.vx * s.length * devicePixelRatio / 10
      const tailY = s.y - s.vy * s.length * devicePixelRatio / 10
      
      const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y)
      grad.addColorStop(0, 'rgba(255, 255, 255, 0)')
      grad.addColorStop(1, `rgba(255, 255, 255, ${s.life})`)
      
      ctx.strokeStyle = grad
      ctx.lineWidth = 2 * devicePixelRatio
      ctx.lineCap = 'round'
      ctx.beginPath()
      ctx.moveTo(tailX, tailY)
      ctx.lineTo(s.x, s.y)
      ctx.stroke()
      
      // 流星头
      ctx.fillStyle = `rgba(255, 255, 255, ${s.life})`
      ctx.beginPath()
      ctx.arc(s.x, s.y, 2 * devicePixelRatio, 0, Math.PI * 2)
      ctx.fill()
    }
    ctx.restore()
  }
        // 从Twig加载记忆
  async function loadMemories() {
    const userId = document.getElementById('userId').value.trim() || 'muqiu'
    const token = document.getElementById('token').value.trim()
    
    if (!token) {
      alert('请先输入认证Token')
      return
    }
    
    const loading = document.getElementById('loading')
    loading.classList.remove('hidden')
    
    try {
      const res = await fetch('https://yubai-memory.zeabur.app/v1/state?userId=' + userId, {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      
      if (!res.ok) throw new Error('认证失败或服务异常')
      
      const data = await res.json()
      stars = []
      threads = []
      claims = []
      
      // 记忆碎片 -> 普通星星
      if (data.fragments && Array.isArray(data.fragments)) {
        const fragments = data.fragments
        const centerX = W / 2
        const centerY = H / 2
        
        fragments.forEach((frag, i) => {
          const angle = (i / fragments.length) * Math.PI * 2 + Math.random() * 0.3
          const radius = (150 + Math.random() * 250) * devicePixelRatio
          const x = centerX + Math.cos(angle) * radius
          const y = centerY + Math.sin(angle) * radius
          
          stars.push({
            id: frag.id || ('f' + i),
            x, y,
            baseX: x,
            baseY: y,
            size: (2.5 + Math.random() * 1.5) * devicePixelRatio,
            color: '168, 216, 255',
            type: 'fragment',
            content: frag.text || frag.content || '记忆碎片',
            time: frag.createdAt || frag.timestamp || '',
            twinkleSpeed: 0.01 + Math.random() * 0.02,
            twinklePhase: Math.random() * Math.PI * 2,
            pulseSize: 0
          })
        })
      }
      
      // 认知亮星
      if (data.claims && Array.isArray(data.claims)) {
        claims = data.claims
        const centerX = W / 2
        const centerY = H / 2
        
        data.claims.forEach((claim, i) => {
          const angle = (i / data.claims.length) * Math.PI * 2 + Math.PI / 4
          const radius = (80 + Math.random() * 100) * devicePixelRatio
          const x = centerX + Math.cos(angle) * radius
          const y = centerY + Math.sin(angle) * radius
          
          stars.push({
            id: claim.id || ('c' + i),
            x, y,
            baseX: x,
            baseY: y,
            size: (6 + Math.random() * 3) * devicePixelRatio,
            color: '255, 214, 165',
            type: 'claim',
            content: claim.text || claim.content || claim.label || '认知亮星',
            time: claim.createdAt || '',
            twinkleSpeed: 0.008 + Math.random() * 0.01,
            twinklePhase: Math.random() * Math.PI * 2,
            pulseSize: 0
          })
        })
      }
      
      // 更新统计
      document.getElementById('fragmentCount').textContent = 
        stars.filter(s => s.type === 'fragment').length
      document.getElementById('threadCount').textContent = '0'
      document.getElementById('claimCount').textContent = 
        stars.filter(s => s.type === 'claim').length
      
      loaded = true
      
    } catch (e) {
      alert('加载失败：' + e.message)
    }
    
    loading.classList.add('hidden')
  }
  
  // 星星点击检测
  let hoveredStar = null
  
  function getMousePos(e) {
    const rect = canvas.getBoundingClientRect()
    return {
      x: (e.clientX - rect.left) * devicePixelRatio,
      y: (e.clientY - rect.top) * devicePixelRatio
    }
  }
  
  function findStarAt(mx, my) {
    // 考虑缩放和偏移
    const worldX = (mx - offsetX) / scale
    const worldY = (my - offsetY) / scale
    
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i]
      const dx = worldX - s.x
      const dy = worldY - s.y
      const dist = Math.sqrt(dx * dx + dy * dy)
      if (dist < s.size * 4) return s
    }
    return null
  }
  
  // 记忆卡片弹窗
  const starInfo = document.getElementById('starInfo')
  const starInfoTag = starInfo.querySelector('.tag')
  const starInfoContent = starInfo.querySelector('.content')
  const starInfoTime = starInfo.querySelector('.time')
  
  function showStarInfo(star, clientX, clientY) {
    const typeNames = { fragment: '记忆碎片', thread: '线索星座', claim: '认知亮星' }
    starInfoTag.className = 'tag ' + star.type
    starInfoTag.textContent = typeNames[star.type] || '记忆'
    starInfoContent.textContent = star.content
    
    if (star.time) {
      const d = new Date(star.time)
      starInfoTime.textContent = d.toLocaleString('zh-CN') + ' · ' + star.id
    } else {
      starInfoTime.textContent = star.id
    }
    
    // 定位
    const infoW = 320
    const infoH = 200
    let left = clientX + 20
    let top = clientY - 100
    
    if (left + infoW > window.innerWidth - 20) left = clientX - infoW - 20
    if (top < 20) top = 20
    if (top + infoH > window.innerHeight - 20) top = window.innerHeight - infoH - 20
    
    starInfo.style.left = left + 'px'
    starInfo.style.top = top + 'px'
    starInfo.classList.add('visible')
  }
  
  function hideStarInfo() {
    starInfo.classList.remove('visible')
  }
  
  canvas.addEventListener('click', (e) => {
    const pos = getMousePos(e)
    const star = findStarAt(pos.x, pos.y)
    if (star) {
      showStarInfo(star, e.clientX, e.clientY)
    } else {
      hideStarInfo()
    }
  })
  
  // 拖拽平移
  canvas.addEventListener('mousedown', (e) => {
    isDragging = true
    lastX = e.clientX
    lastY = e.clientY
    canvas.style.cursor = 'grabbing'
  })
  
  window.addEventListener('mousemove', (e) => {
    if (isDragging) {
      offsetX += (e.clientX - lastX) * devicePixelRatio
      offsetY += (e.clientY - lastY) * devicePixelRatio
      lastX = e.clientX
      lastY = e.clientY
    }
  })
  
  window.addEventListener('mouseup', () => {
    isDragging = false
    canvas.style.cursor = 'grab'
  })
  
  canvas.style.cursor = 'grab'
  
  // 滚轮缩放
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault()
    const pos = getMousePos(e)
    const delta = e.deltaY > 0 ? 0.9 : 1.1
    const newScale = Math.max(0.3, Math.min(3, scale * delta))
    
    // 以鼠标位置为中心缩放
    offsetX = pos.x - (pos.x - offsetX) * (newScale / scale)
    offsetY = pos.y - (pos.y - offsetY) * (newScale / scale)
    scale = newScale
  }, { passive: false })
  
  // 触摸支持
  let lastTouchDist = 0
  
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true
      lastX = e.touches[0].clientX
      lastY = e.touches[0].clientY
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX
      const dy = e.touches[0].clientY - e.touches[1].clientY
      lastTouchDist = Math.sqrt(dx * dx + dy * dy)
    }
  })
  
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault()
    if (e.touches.length === 1 && isDragging) {
      offsetX += (e.touches[0].clientX - lastX) * devicePixelRatio
      offsetY += (e.touches[0].clientY - lastY) * devicePixelRatio
      lastX = e.touches[0].clientX
      lastY = e.touches[0].clientY
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX
      const dy = e.touches[0].clientY - e.touches[1].clientY
      const dist = Math.sqrt(dx * dx + dy * dy)
      const ratio = dist / lastTouchDist
      scale = Math.max(0.3, Math.min(3, scale * ratio))
      lastTouchDist = dist
    }
  }, { passive: false })
  
  canvas.addEventListener('touchend', () => {
    isDragging = false
  })
        // 主渲染
  let time = 0
  
  function render() {
    time += 1
    ctx.clearRect(0, 0, W, H)
    
    // 背景远景星
    for (const s of bgStars) {
      const twinkle = Math.sin(time * s.twinkleSpeed + s.twinklePhase) * 0.3 + 0.7
      ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity * twinkle})`
      ctx.beginPath()
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2)
      ctx.fill()
    }
    
    // 流星
    updateShootingStars()
    drawShootingStars()
    
    // 记忆星星
    if (loaded && stars.length > 0) {
      ctx.save()
      ctx.translate(offsetX, offsetY)
      ctx.scale(scale, scale)
      
      // 先画连接线（如果有threads）
      // 暂略，后续加星座连线
      
      // 画星星
      for (const s of stars) {
        const twinkle = Math.sin(time * s.twinkleSpeed + s.twinklePhase) * 0.3 + 0.7
        const currentSize = s.size + s.pulseSize
        drawStarGlow(s.x, s.y, currentSize * twinkle, s.color, twinkle)
        
        // 悬浮脉冲
        if (s.pulseSize > 0) {
          s.pulseSize *= 0.95
          if (s.pulseSize < 0.1) s.pulseSize = 0
        }
      }
      
      ctx.restore()
    }
    
    // 偶尔生成流星
    if (Math.random() < 0.008) {
      createShootingStar()
    }
    
    requestAnimationFrame(render)
  }
  
  render()
  
  // 绑定按钮
  document.getElementById('loadBtn').addEventListener('click', loadMemories)
  
  // 回车也能加载
  document.getElementById('token').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadMemories()
  })
  document.getElementById('userId').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadMemories()
  })
  
  // 自动尝试（如果url里带参数）
  const params = new URLSearchParams(window.location.search)
  if (params.get('userId')) {
    document.getElementById('userId').value = params.get('userId')
  }
  if (params.get('token')) {
    document.getElementById('token').value = params.get('token')
    loadMemories()
  }
</script>

</body>
</html>
