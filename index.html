<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>衔枝 Twig · 叙事记忆引擎</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232e4a3c'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%23c9a04a' stroke-width='1.2'/%3E%3Ctext x='16' y='21.5' font-size='13' text-anchor='middle' fill='%23f2ead6' font-family='serif'%3E%E8%A1%94%3C/text%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var m = document.location.hash.match(/theme=([^&]+)/)
          if (m) localStorage.setItem('twig-theme', m[1])
          var t = localStorage.getItem('twig-theme')
          if (t) document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
