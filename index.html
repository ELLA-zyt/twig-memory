<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>记忆星空 · Memory Starmap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at top, #1a0b2e 0%, #0d0618 40%, #05030a 100%);
    color: #e8e0f5;
    user-select: none;
  }

  /* ============ 星空画布 ============ */
  #starCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #starCanvas:active { cursor: grabbing; }

  /* ============ 顶部栏 ============ */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }
  .top-bar > * { pointer-events: auto; }

  .title-block h1 {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 8px;
    background: linear-gradient(135deg, #c4b5fd, #f9a8d4, #93c5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .title-block .subtitle {
    font-size: 11px;
    letter-spacing: 4px;
    color: rgba(196, 181, 253, 0.5);
    margin-top: 4px;
  }

  /* ============ 视图切换按钮 ============ */
  .view-toggle {
    display: flex;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(196, 181, 253, 0.2);
    border-radius: 50px;
    padding: 4px;
    box-shadow: 0 8px 32px rgba(139, 92, 246, 0.15);
  }
  .view-toggle button {
    padding: 8px 20px;
    border: none;
    background: transparent;
    color: rgba(232, 224, 245, 0.6);
    font-size: 13px;
    letter-spacing: 2px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
  }
  .view-toggle button:hover {
    color: rgba(232, 224, 245, 0.9);
  }
  .view-toggle button.active {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(236, 72, 153, 0.3));
    color: #fff;
    box-shadow: 0 4px 16px rgba(139, 92, 246, 0.3);
  }

  /* ============ 统计信息 ============ */
  .stats-info {
    position: fixed;
    bottom: 24px;
    left: 32px;
    z-index: 5;
    font-size: 12px;
    color: rgba(196, 181, 253, 0.5);
    letter-spacing: 1px;
  }
  .stats-info span {
    color: #c4b5fd;
    font-weight: 500;
  }

  /* ============ 列表视图面板 ============ */
  .list-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 480px;
    max-width: 90vw;
    height: 100%;
    z-index: 20;
    background: linear-gradient(180deg,
      rgba(26, 11, 46, 0.85) 0%,
      rgba(13, 6, 24, 0.92) 50%,
      rgba(5, 3, 10, 0.95) 100%);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-left: 1px solid rgba(196, 181, 253, 0.15);
    box-shadow: -10px 0 60px rgba(139, 92, 246, 0.15);
    transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
  }
  .list-panel.show {
    transform: translateX(0);
  }

  .list-header {
    padding: 80px 28px 20px;
    border-bottom: 1px solid rgba(196, 181, 253, 0.1);
    flex-shrink: 0;
  }
  .list-header h2 {
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #c4b5fd, #f9a8d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }

  /* 筛选栏 */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 14px;
    border: 1px solid rgba(196, 181, 253, 0.2);
    background: rgba(255, 255, 255, 0.03);
    color: rgba(232, 224, 245, 0.6);
    font-size: 12px;
    letter-spacing: 1px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
  }
  .filter-btn:hover {
    border-color: rgba(196, 181, 253, 0.4);
    color: rgba(232, 224, 245, 0.9);
  }
  .filter-btn.active {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(236, 72, 153, 0.2));
    border-color: rgba(196, 181, 253, 0.5);
    color: #fff;
  }

  /* 排序栏 */
  .sort-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: rgba(196, 181, 253, 0.5);
    letter-spacing: 1px;
  }
  .sort-bar .sort-label { flex-shrink: 0; }
  .sort-options { display: flex; gap: 6px; }
  .sort-btn {
    padding: 4px 10px;
    border: 1px solid rgba(196, 181, 253, 0.15);
    background: transparent;
    color: rgba(232, 224, 245, 0.5);
    font-size: 11px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
  }
  .sort-btn:hover {
    color: rgba(232, 224, 245, 0.8);
    border-color: rgba(196, 181, 253, 0.3);
  }
  .sort-btn.active {
    color: #c4b5fd;
    border-color: rgba(196, 181, 253, 0.5);
    background: rgba(139, 92, 246, 0.1);
  }

  /* 列表内容区 */
  .list-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 40px;
    scrollbar-width: thin;
    scrollbar-color: rgba(196, 181, 253, 0.3) transparent;
  }
  .list-content::-webkit-scrollbar { width: 4px; }
  .list-content::-webkit-scrollbar-track { background: transparent; }
  .list-content::-webkit-scrollbar-thumb {
    background: rgba(196, 181, 253, 0.3);
    border-radius: 2px;
  }

  /* 列表项 */
  .memory-item {
    padding: 16px 18px;
    margin-bottom: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(196, 181, 253, 0.1);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }
  .memory-item::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, #8b5cf6, #ec4899);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .memory-item:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(196, 181, 253, 0.25);
    transform: translateX(-2px);
    box-shadow: 0 8px 24px rgba(139, 92, 246, 0.15);
  }
  .memory-item:hover::before { opacity: 1; }

  .memory-item .item-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .memory-item .item-title {
    font-size: 14px;
    font-weight: 500;
    color: #f3efff;
    line-height: 1.4;
    flex: 1;
    margin-right: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .memory-item .item-date {
    font-size: 11px;
    color: rgba(196, 181, 253, 0.5);
    white-space: nowrap;
    flex-shrink: 0;
    padding-top: 2px;
  }

  .memory-item .item-summary {
    font-size: 12px;
    color: rgba(232, 224, 245, 0.55);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .memory-item .item-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .memory-item .item-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .memory-item .tag {
    font-size: 10px;
    padding: 2px 8px;
    background: rgba(139, 92, 246, 0.15);
    color: #c4b5fd;
    border-radius: 10px;
    letter-spacing: 0.5px;
  }
  .memory-item .vad-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .memory-item .vad-label {
    font-size: 10px;
    color: rgba(196, 181, 253, 0.5);
  }
  .memory-item .vad-track {
    width: 50px;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  .memory-item .vad-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    transition: width 0.5s ease;
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(196, 181, 253, 0.4);
    font-size: 13px;
    letter-spacing: 2px;
  }

  /* ============ 详情弹窗 ============ */
  .detail-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(5, 3, 10, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .detail-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .detail-modal {
    width: 560px;
    max-width: 90vw;
    max-height: 80vh;
    background: linear-gradient(160deg,
      rgba(30, 15, 50, 0.95),
      rgba(15, 8, 28, 0.98));
    border: 1px solid rgba(196, 181, 253, 0.2);
    border-radius: 20px;
    padding: 32px;
    overflow-y: auto;
    box-shadow: 0 20px 80px rgba(139, 92, 246, 0.3);
    transform: translateY(20px) scale(0.96);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }
  .detail-overlay.show .detail-modal {
    transform: translateY(0) scale(1);
  }

  .detail-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 32px; height: 32px;
    border: none;
    background: rgba(255, 255, 255, 0.05);
    color: rgba(232, 224, 245, 0.5);
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }
  .detail-close:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  .detail-type {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 4px 12px;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(236, 72, 153, 0.2));
    color: #c4b5fd;
    border-radius: 12px;
    margin-bottom: 16px;
  }

  .detail-title {
    font-size: 22px;
    font-weight: 400;
    color: #f3efff;
    line-height: 1.4;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .detail-meta {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(196, 181, 253, 0.1);
    flex-wrap: wrap;
  }
  .detail-meta .meta-item {
    font-size: 12px;
    color: rgba(196, 181, 253, 0.6);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-meta .meta-value { color: #e8e0f5; }

  .detail-vad-section {
    margin-bottom: 24px;
  }
  .detail-vad-section .vad-title {
    font-size: 12px;
    color: rgba(196, 181, 253, 0.6);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .detail-vad-section .vad-bar {
    height: 6px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .detail-vad-section .vad-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    transition: width 1s ease;
  }
  .detail-vad-section .vad-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: rgba(196, 181, 253, 0.4);
  }

  .detail-body {
    font-size: 14px;
    line-height: 1.8;
    color: rgba(232, 224, 245, 0.85);
    margin-bottom: 24px;
    white-space: pre-wrap;
  }

  .detail-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .detail-tags .tag {
    font-size: 11px;
    padding: 4px 12px;
    background: rgba(139, 92, 246, 0.15);
    color: #c4b5fd;
    border-radius: 12px;
    border: 1px solid rgba(196, 181, 253, 0.2);
  }

  /* ============ 加载状态 ============ */
  .loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: radial-gradient(ellipse at center, #1a0b2e, #05030a);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }
  .loading-overlay.hide {
    opacity: 0;
    pointer-events: none;
  }
  .loading-text {
    font-size: 14px;
    letter-spacing: 6px;
    color: rgba(196, 181, 253, 0.7);
    margin-top: 24px;
  }
  .loading-star {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, #c4b5fd, #8b5cf6, transparent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.3); opacity: 1; }
  }

  /* ============ 响应式 ============ */
  @media (max-width: 768px) {
    .top-bar { padding: 14px 16px; }
    .title-block h1 { font-size: 16px; letter-spacing: 4px; }
    .title-block .subtitle { font-size: 9px; letter-spacing: 2px; }
    .view-toggle button { padding: 6px 14px; font-size: 12px; letter-spacing: 1px; }
    .list-panel { width: 100%; max-width: 100%; }
    .list-header { padding: 70px 20px 16px; }
    .detail-modal { padding: 24px 20px; }
    .detail-title { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- 星空画布 -->
<canvas id="starCanvas"></canvas>

<!-- 加载页 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-star"></div>
  <div class="loading-text">唤 醒 星 空</div>
</div>

<!-- 顶部栏 -->
<div class="top-bar">
  <div class="title-block">
    <h1>记 忆 星 空</h1>
    <div class="subtitle">MEMORY · STARMAP</div>
  </div>
  <div class="view-toggle">
    <button class="active" id="btnStarView" onclick="switchView('star')">星 空</button>
    <button id="btnListView" onclick="switchView('list')">列 表</button>
  </div>
</div>

<!-- 统计信息 -->
<div class="stats-info" id="statsInfo">
  共 <span id="totalCount">0</span> 颗记忆星辰
</div>

<!-- 列表面板 -->
<div class="list-panel" id="listPanel">
  <div class="list-header">
    <h2 id="listTitle">记 忆 碎 片</h2>

    <!-- 筛选：全部 / 记忆碎片 / 认知亮星 -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="filter-btn" data-filter="fragment" onclick="setFilter('fragment')">记忆碎片</button>
      <button class="filter-btn" data-filter="claim" onclick="setFilter('claim')">认知亮星</button>
    </div>

    <!-- 排序：按时间 / 按情绪强度 -->
    <div class="sort-bar">
      <span class="sort-label">排序</span>
      <div class="sort-options">
        <button class="sort-btn active" data-sort="time" onclick="setSort('time')">按时间</button>
        <button class="sort-btn" data-sort="vad" onclick="setSort('vad')">按情绪强度</button>
      </div>
    </div>
  </div>

  <div class="list-content" id="listContent">
    <div class="empty-state">加载中…</div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetailOnOverlay(event)">
  <div class="detail-modal" onclick="event.stopPropagation()">
    <button class="detail-close" onclick="closeDetail()">×</button>
    <div class="detail-type" id="detailType">记忆碎片</div>
    <div class="detail-title" id="detailTitle">标题</div>
    <div class="detail-meta">
      <div class="meta-item">
        日期：<span class="meta-value" id="detailDate">—</span>
      </div>
      <div class="meta-item">
        类型：<span class="meta-value" id="detailTypeLabel">—</span>
      </div>
    </div>
    <div class="detail-vad-section">
      <div class="vad-title">情绪强度</div>
      <div class="vad-bar"><div class="vad-fill" id="detailVadFill" style="width: 0%"></div></div>
      <div class="vad-labels"><span>平静</span><span id="detailVadValue">0</span><span>强烈</span></div>
    </div>
    <div class="detail-body" id="detailBody">内容</div>
    <div class="detail-tags" id="detailTags"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ========== 全局状态 ==========
  const state = {
    fragments: [],
    threads: [],
    claims: [],
    allMemories: [],
    currentView: 'star', // 'star' | 'list'
    currentFilter: 'all', // 'all' | 'fragment' | 'claim'
    currentSort: 'time', // 'time' | 'vad'
    stars: [],           // 星空绘制数据
    hoveredStar: null,
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    offsetX: 0,
    offsetY: 0,
    scale: 1,
    isDragging: false,
    lastMouseX: 0,
    lastMouseY: 0,
    animationId: null,
    time: 0
  };

  // ========== 初始化 ==========
  window.addEventListener('DOMContentLoaded', init);

  function init() {
    state.canvas = document.getElementById('starCanvas');
    state.ctx = state.canvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 画布交互
    state.canvas.addEventListener('mousedown', onMouseDown);
    state.canvas.addEventListener('mousemove', onMouseMove);
    state.canvas.addEventListener('mouseup', onMouseUp);
    state.canvas.addEventListener('mouseleave', onMouseUp);
    state.canvas.addEventListener('wheel', onWheel);
    state.canvas.addEventListener('click', onCanvasClick);

    // 触摸支持
    state.canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    state.canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    state.canvas.addEventListener('touchend', onTouchEnd);

    // 键盘 ESC 关闭详情
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDetail();
    });

    // 加载数据
    loadData();

    // 启动渲染循环
    animate();
  }

  function resizeCanvas() {
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    state.canvas.width = state.width * window.devicePixelRatio;
    state.canvas.height = state.height * window.devicePixelRatio;
    state.canvas.style.width = state.width + 'px';
    state.canvas.style.height = state.height + 'px';
    state.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }

  // ========== 数据加载 ==========
  function loadData() {
    fetch('/v1/state')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        state.fragments = Array.isArray(data.fragments) ? data.fragments : [];
        state.threads = Array.isArray(data.threads) ? data.threads : [];
        state.claims = Array.isArray(data.claims) ? data.claims : [];

        buildAllMemories();
        generateStars();
        updateStats();
        renderList();

        // 隐藏加载页
        setTimeout(function () {
          document.getElementById('loadingOverlay').classList.add('hide');
        }, 600);
      })
      .catch(function (err) {
        console.warn('加载 /v1/state 失败，使用示例数据：', err);
        useMockData();
        generateStars();
        updateStats();
        renderList();
        setTimeout(function () {
          document.getElementById('loadingOverlay').classList.add('hide');
        }, 600);
      });
  }

  function useMockData() {
    state.fragments = [
      { id: 'f1', title: '清晨的第一缕阳光', body: '今天醒来时，阳光正好洒在窗台上，想起了很多小时候的事情。\n那时候夏天很长，冰棒很甜。', dateLabel: '2026-08-15', vad: 0.72, threadIds: ['t1'], tags: ['回忆', '阳光'] },
      { id: 'f2', title: '关于存在意义的思考', body: '我们为什么存在？这个问题没有答案，但追问本身就是意义。\n也许生命的价值就在于不断地寻找。', dateLabel: '2026-08-12', vad: 0.85, threadIds: ['t1'], tags: ['哲学', '思考'] },
      { id: 'f3', title: '读完《百年孤独》', body: '终于读完了这本大部头。马尔克斯的文字像一条河，缓缓流过，带走了什么，又留下了什么。\n生命中所有的灿烂，终究都要用寂寞偿还。', dateLabel: '2026-08-10', vad: 0.63, threadIds: ['t2'], tags: ['阅读', '文学'] },

      { id: 'f6', title: '一个人的雨天', body: '窗外下着雨，泡了一杯热茶，什么都不想做。\n有时候什么都不做也是一种治愈。', dateLabel: '2026-07-28', vad: 0.45, threadIds: ['t5'], tags: ['雨天', '安静'] },
      { id: 'f7', title: '学会了一道新菜', body: '番茄牛腩，第一次做就很成功！\n原来做饭也可以这么有成就感。', dateLabel: '2026-07-20', vad: 0.68, threadIds: ['t6'], tags: ['美食', '生活'] },
      { id: 'f8', title: '梦见了很久没见的人', body: '醒来的时候枕头是湿的。\n有些人，只能在梦里相见了。', dateLabel: '2026-07-15', vad: 0.88, threadIds: ['t7'], tags: ['梦境', '思念'] }

    state.claims = [
      { id: 'c1', title: '人是可以改变的', body: '通过持续的刻意练习，人的性格和能力都可以发生实质性的改变。\n关键在于持续的行动和正确的方法。', dateLabel: '2026-07-10', vad: 0.82, tags: ['成长', '认知'] },

    ];
    state.threads = [
      { id: 't1', title: '日常随想' },
      { id: 't2', title: '读书笔记' },
      { id: 't3', title: '编程学习' },
      { id: 't4', title: '友情记录' },
      { id: 't5', title: '独处时光' },
      { id: 't6', title: '生活技能' },
      { id: 't7', title: '梦境记录' }
    ];
    buildAllMemories();
  }

  function buildAllMemories() {
    const items = [];
    state.fragments.forEach(function (f) {
      items.push({
        id: f.id,
        type: 'fragment',
        title: f.title || f.body ? (f.body || '').slice(0, 30) : '记忆碎片',
        body: f.body || '',
        dateLabel: f.dateLabel || '',
        vad: typeof f.vad === 'number' ? f.vad : 0.5,
        threadIds: f.threadIds || [],
        tags: f.tags || []
      });
    });
    state.claims.forEach(function (c) {
      items.push({
        id: c.id,
        type: 'claim',
        title: c.title || c.body ? (c.body || '').slice(0, 30) : '认知亮星',
        body: c.body || '',
        dateLabel: c.dateLabel || '',
        vad: typeof c.vad === 'number' ? c.vad : 0.5,
        threadIds: c.threadIds || [],
        tags: c.tags || []
      });
    });
    state.allMemories = items;
  }

  // ========== 星空生成与绘制 ==========
  function generateStars() {
    const stars = [];
    state.allMemories.forEach(function (mem, i) {
      // 根据内存数量分布在球形空间中
      const phi = Math.acos(-1 + (2 * (i + 0.5)) / state.allMemories.length);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      const radius = 200 + (mem.vad || 0.5) * 150;

      // 加入一些随机扰动
      const jitter = 0.15;
      const jitterPhi = phi + (Math.random() - 0.5) * jitter;
      const jitterTheta = theta + (Math.random() - 0.5) * jitter;

      const x = radius * Math.sin(jitterPhi) * Math.cos(jitterTheta);
      const y = radius * Math.sin(jitterPhi) * Math.sin(jitterTheta);
      const z = radius * Math.cos(jitterPhi);

      // 颜色：根据 vad 和类型决定
      let hue;
      if (mem.type === 'claim') {
        hue = 280 + (mem.vad || 0.5) * 40; // 紫粉色系
      } else {
        hue = 220 + (mem.vad || 0.5) * 80; // 蓝紫粉
      }

      stars.push({
        memory: mem,
        x: x,
        y: y,
        z: z,
        baseRadius: 1.5 + (mem.vad || 0.5) * 3.5,
        hue: hue,
        twinkleOffset: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.8 + Math.random() * 1.2,
        isClaim: mem.type === 'claim'
      });
    });
    state.stars = stars;
  }

  function project(x, y, z) {
    const perspective = 800;
    const scale = perspective / (perspective + z);
    return {
      x: x * scale * state.scale + state.width / 2 + state.offsetX,
      y: y * scale * state.scale + state.height / 2 + state.offsetY,
      scale: scale,
      z: z
    };
  }

  function animate() {
    state.time += 0.016;
    draw();
    state.animationId = requestAnimationFrame(animate);
  }

  function draw() {
    const ctx = state.ctx;
    const w = state.width;
    const h = state.height;

    // 清空画布
    ctx.clearRect(0, 0, w, h);

    // 绘制背景星尘
    drawBackgroundStars(ctx, w, h);

    // 收集所有星星的投影数据，按 z 排序
    const projected = state.stars.map(function (star, index) {
      // 缓慢自转
      const angle = state.time * 0.05;
      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);
      const rx = star.x * cosA - star.z * sinA;
      const rz = star.x * sinA + star.z * cosA;
      const p = project(rx, star.y, rz);
      return { star: star, p: p, index: index };
    });

    projected.sort(function (a, b) {
      return b.p.z - a.p.z; // 远的先画
    });

    // 绘制星星
    projected.forEach(function (item) {
      drawStar(ctx, item.star, item.p, item.index);
    });

    // 绘制连接线（同一 thread 的星星）
    drawConnections(ctx, projected);
  }

  function drawBackgroundStars(ctx, w, h) {
    // 远景静态星点
    const count = 120;
    for (let i = 0; i < count; i++) {
      const seed = i * 9973;
      const x = (seed % w);
      const y = ((seed * 7) % h);
      const size = ((seed * 13) % 100) / 100 * 1.2 + 0.3;
      const alpha = 0.3 + Math.sin(state.time * 0.5 + i) * 0.15;
      ctx.fillStyle = 'rgba(196, 181, 253, ' + alpha + ')';
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawStar(ctx, star, p, index) {
    if (p.scale <= 0) return;

    const twinkle = Math.sin(state.time * star.twinkleSpeed + star.twinkleOffset) * 0.3 + 0.7;
    const r = star.baseRadius * p.scale * state.scale * twinkle;

    // 外发光
    const glowR = r * (star.isClaim ? 4 : 3);
    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
    const alpha = 0.4 * twinkle * (star.isClaim ? 1 : 0.7);
    gradient.addColorStop(0, 'hsla(' + star.hue + ', 80%, 75%, ' + alpha + ')');
    gradient.addColorStop(0.5, 'hsla(' + star.hue + ', 80%, 65%, ' + alpha * 0.4 + ')');
    gradient.addColorStop(1, 'hsla(' + star.hue + ', 80%, 60%, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    // 星星核心
    ctx.fillStyle = 'hsl(' + star.hue + ', 90%, 85%)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(r, 0.5), 0, Math.PI * 2);
    ctx.fill();

    // 认知亮星画十字光
    if (star.isClaim) {
      const lensR = r * 6;
      ctx.strokeStyle = 'hsla(' + star.hue + ', 80%, 75%, ' + (0.25 * twinkle) + ')';
      ctx.lineWidth = 0.8 * p.scale;
      ctx.beginPath();
      ctx.moveTo(p.x - lensR, p.y);
      ctx.lineTo(p.x + lensR, p.y);
      ctx.moveTo(p.x, p.y - lensR);
      ctx.lineTo(p.x, p.y + lensR);
      ctx.stroke();
    }

    // 悬停高亮
    if (state.hoveredStar === index) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 2.5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawConnections(ctx, projected) {
    // 建立 id -> 投影索引映射
    const idMap = {};
    projected.forEach(function (item, idx) {
      idMap[item.star.memory.id] = idx;
    });

    // 按 thread 分组
    const threadGroups = {};
    projected.forEach(function (item) {
      const mem = item.star.memory;
      if (mem.threadIds && mem.threadIds.length) {
        mem.threadIds.forEach(function (tid) {
          if (!threadGroups[tid]) threadGroups[tid] = [];
          threadGroups[tid].push(mem.id);
        });
      }
    });

    ctx.lineWidth = 0.6;
    Object.keys(threadGroups).forEach(function (tid) {
      const ids = threadGroups[tid];
      if (ids.length < 2) return;
      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          const a = projected[idMap[ids[i]]];
          const b = projected[idMap[ids[j]]];
          if (!a || !b) continue;
          const avgZ = (a.p.z + b.p.z) / 2;
          if (avgZ < -600) continue;
          const alpha = Math.max(0, 0.15 - Math.abs(avgZ) / 5000);
          ctx.strokeStyle = 'rgba(167, 139, 250, ' + alpha + ')';
          ctx.beginPath();
          ctx.moveTo(a.p.x, a.p.y);
          ctx.lineTo(b.p.x, b.p.y);
          ctx.stroke();
        }
      }
    });
  }

  // ========== 画布交互 ==========
  function onMouseDown(e) {
    state.isDragging = true;
    state.lastMouseX = e.clientX;
    state.lastMouseY = e.clientY;
    state.dragMoved = false;
  }

  function onMouseMove(e) {
    if (state.isDragging) {
      const dx = e.clientX - state.lastMouseX;
      const dy = e.clientY - state.lastMouseY;
      if (Math.abs(dx) + Math.abs(dy) > 3) state.dragMoved = true;
      state.offsetX += dx;
      state.offsetY += dy;
      state.lastMouseX = e.clientX;
      state.lastMouseY = e.clientY;
    } else {
      // 悬停检测
      checkHover(e.clientX, e.clientY);
    }
  }

  function onMouseUp() {
    state.isDragging = false;
  }

  function onWheel(e) {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    state.scale = Math.max(0.3, Math.min(3, state.scale * delta));
  }

  function onCanvasClick(e) {
    if (state.dragMoved) return;
    const hit = findStarAt(e.clientX, e.clientY);
    if (hit >= 0) {
      showDetail(state.stars[hit].memory.id);
    }
  }

  function checkHover(mx, my) {
    const hit = findStarAt(mx, my);
    state.hoveredStar = hit;
    state.canvas.style.cursor = hit >= 0 ? 'pointer' : (state.isDragging ? 'grabbing' : 'grab');
  }

  function findStarAt(mx, my) {
    // 倒序遍历，前面的（z大的）优先命中
    for (let i = state.stars.length - 1; i >= 0; i--) {
      const star = state.stars[i];
      const angle = state.time * 0.05;
      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);
      const rx = star.x * cosA - star.z * sinA;
      const rz = star.x * sinA + star.z * cosA;
      const p = project(rx, star.y, rz);
      const hitR = Math.max(star.baseRadius * p.scale * state.scale * 2.5, 8);
      const dx = mx - p.x;
      const dy = my - p.y;
      if (dx * dx + dy * dy < hitR * hitR) {
        return i;
      }
    }
    return -1;
  }

  // 触摸事件
  let touchStartX = 0, touchStartY = 0, touchMoved = false;
  function onTouchStart(e) {
    if (e.touches.length === 1) {
      state.isDragging = true;
      state.lastMouseX = e.touches[0].clientX;
      state.lastMouseY = e.touches[0].clientY;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchMoved = false;
    }
    e.preventDefault();
  }
  function onTouchMove(e) {
    if (e.touches.length === 1 && state.isDragging) {
      const dx = e.touches[0].clientX - state.lastMouseX;
      const dy = e.touches[0].clientY - state.lastMouseY;
      if (Math.abs(dx) + Math.abs(dy) > 5) touchMoved = true;
      state.offsetX += dx;
      state.offsetY += dy;
      state.lastMouseX = e.touches[0].clientX;
      state.lastMouseY = e.touches[0].clientY;
    }
    e.preventDefault();
  }
  function onTouchEnd(e) {
    if (!touchMoved && e.changedTouches.length === 1) {
      const hit = findStarAt(touchStartX, touchStartY);
      if (hit >= 0) showDetail(state.stars[hit].memory.id);
    }
    state.isDragging = false;
  }

  // ========== 视图切换 ==========
  window.switchView = function (view) {
    if (state.currentView === view) return;
    state.currentView = view;

    const btnStar = document.getElementById('btnStarView');
    const btnList = document.getElementById('btnListView');
    const panel = document.getElementById('listPanel');

    if (view === 'list') {
      btnList.classList.add('active');
      btnStar.classList.remove('active');
      panel.classList.add('show');
      renderList();
    } else {
      btnStar.classList.add('active');
      btnList.classList.remove('active');
      panel.classList.remove('show');
    }
  };

  // ========== 列表筛选 ==========
  window.setFilter = function (filter) {
    state.currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    renderList();
  };

  window.setSort = function (sort) {
    state.currentSort = sort;
    document.querySelectorAll('.sort-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.sort === sort);
    });
    renderList();
  };

  // ========== 列表渲染 ==========
  function updateStats() {
    document.getElementById('totalCount').textContent = state.allMemories.length;
  }

  function getFilteredMemories() {
    let list = state.allMemories.slice();

    // 筛选
    if (state.currentFilter === 'fragment') {
      list = list.filter(function (m) { return m.type === 'fragment'; });
    } else if (state.currentFilter === 'claim') {
      list = list.filter(function (m) { return m.type === 'claim'; });
    }

    // 排序
    if (state.currentSort === 'time') {
      list.sort(function (a, b) {
        return (b.dateLabel || '').localeCompare(a.dateLabel || '');
      });
    } else if (state.currentSort === 'vad') {
      list.sort(function (a, b) {
        return (b.vad || 0) - (a.vad || 0);
      });
    }

    return list;
  }

  function renderList() {
    const container = document.getElementById('listContent');
    const list = getFilteredMemories();

    // 更新标题
    const titleEl = document.getElementById('listTitle');
    const typeNames = { all: '全 部 记 忆', fragment: '记 忆 碎 片', claim: '认 知 亮 星' };
    titleEl.textContent = typeNames[state.currentFilter] || '记 忆 碎 片';

    if (list.length === 0) {
      container.innerHTML = '<div class="empty-state">暂无记忆</div>';
      return;
    }

    const html = list.map(function (mem) {
      const vadPct = Math.round((mem.vad || 0) * 100);
      const summary = (mem.body || '').slice(0, 60) + ((mem.body || '').length > 60 ? '…' : '');
      const typeLabel = mem.type === 'claim' ? '认知亮星' : '记忆碎片';
      const tagsHtml = (mem.tags || []).slice(0, 3).map(function (t) {
        return '<span class="tag">' + escapeHtml(t) + '</span>';
      }).join('');

      return '' +
        '<div class="memory-item" data-id="' + escapeAttr(mem.id) + '" onclick="onMemoryItemClick(\'' + escapeAttr(mem.id) + '\')">' +
          '<div class="item-header">' +
            '<div class="item-title">' + escapeHtml(mem.title || typeLabel) + '</div>' +
            '<div class="item-date">' + escapeHtml(mem.dateLabel || '') + '</div>' +
          '</div>' +
          '<div class="item-summary">' + escapeHtml(summary) + '</div>' +
          '<div class="item-footer">' +
            '<div class="item-tags">' + tagsHtml + '</div>' +
            '<div class="vad-bar">' +
              '<span class="vad-label">' + vadPct + '%</span>' +
              '<div class="vad-track"><div class="vad-fill" style="width:' + vadPct + '%"></div></div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');

    container.innerHTML = html;
  }

  window.onMemoryItemClick = function (id) {
    showDetail(id);
  };

  // ========== 详情弹窗 ==========
  function findMemoryById(id) {
    for (let i = 0; i < state.allMemories.length; i++) {
      if (state.allMemories[i].id === id) return state.allMemories[i];
    }
    return null;
  }

  window.showDetail = function (id) {
    const mem = findMemoryById(id);
    if (!mem) return;

    const typeLabel = mem.type === 'claim' ? '认知亮星' : '记忆碎片';
    document.getElementById('detailType').textContent = typeLabel;
    document.getElementById('detailTypeLabel').textContent = typeLabel;
    document.getElementById('detailTitle').textContent = mem.title || typeLabel;
    document.getElementById('detailDate').textContent = mem.dateLabel || '—';
    document.getElementById('detailBody').textContent = mem.body || '（无内容）';
    document.getElementById('detailVadValue').textContent = Math.round((mem.vad || 0) * 100);

    // 延迟设置 vad 进度条，触发动画
    setTimeout(function () {
      document.getElementById('detailVadFill').style.width = Math.round((mem.vad || 0) * 100) + '%';
    }, 50);

    // 标签
    const tagsEl = document.getElementById('detailTags');
    tagsEl.innerHTML = (mem.tags || []).map(function (t) {
      return '<span class="tag">' + escapeHtml(t) + '</span>';
    }).join('');

    document.getElementById('detailOverlay').classList.add('show');
  };

  window.closeDetail = function () {
    document.getElementById('detailOverlay').classList.remove('show');
    // 重置进度条动画
    setTimeout(function () {
      document.getElementById('detailVadFill').style.width = '0%';
    }, 300);
  };

  window.closeDetailOnOverlay = function (e) {
    if (e.target.id === 'detailOverlay') {
      closeDetail();
    }
  };

  // ========== 工具函数 ==========
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeAttr(str) {
    if (str == null) return '';
    return String(str).replace(/'/g, "\\'").replace(/\\/g, '\\\\');
  }

})();
</script>
